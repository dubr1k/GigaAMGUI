name: Build portable

# Собирает портативные бинарники GigaAM Transcriber для трёх платформ.
# Во всех случаях используется ОДИН подход (как на Windows): PyTorch НЕ вшивается
# в бинарник, а скачивается при первом запуске в общий кэш с выбором устройства.
# torch в окружении сборки нужен только чтобы PyInstaller смог проанализировать
# gigaam/pyannote — в итоговый файл он не попадает (см. packaging/gigaam_app_portable.spec).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: test-tui

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            asset: GigaAMTranscriber-windows-x64.exe
            offline_asset: GigaAMTranscriber-windows-x64-offline.zip
            built: dist/GigaAMTranscriber_portable.exe
            torch_index: "--index-url https://download.pytorch.org/whl/cpu"

          - os: macos-14
            label: macOS arm64
            asset: GigaAMTranscriber-macos-arm64
            offline_asset: GigaAMTranscriber-macos-arm64-offline.zip
            built: dist/GigaAMTranscriber_portable
            torch_index: ""

          - os: ubuntu-latest
            label: Linux x64
            asset: GigaAMTranscriber-linux-x64
            offline_asset: GigaAMTranscriber-linux-x64-offline.zip
            built: dist/GigaAMTranscriber_portable
            torch_index: "--index-url https://download.pytorch.org/whl/cpu"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # ffmpeg нужен приложению в рантайме; EGL/GL — для offscreen PyQt GUI-тестов.
      # libportaudio2 нужен не только раннеру: спек вшивает его в бинарник,
      # потому что Linux-колесо sounddevice не содержит PortAudio (issue #47).
      - name: Install ffmpeg, Qt and PortAudio runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libportaudio2

      # --- Вкладываем ПРАВИЛЬНЫЙ по ОС/арх. ffmpeg в bin/, чтобы он вшился в
      # портативный бинарник (спек забирает bin/ffmpeg.exe на Windows и
      # bin/ffmpeg на других ОС). Так у пользователя всё работает без ручной
      # установки ffmpeg. macOS использует уже закоммиченный arm64-бинарь bin/ffmpeg.
      - name: Provision bundled ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item (Get-ChildItem -Recurse ffmpeg_extract -Filter ffmpeg.exe  | Select-Object -First 1).FullName bin/ffmpeg.exe  -Force
          Copy-Item (Get-ChildItem -Recurse ffmpeg_extract -Filter ffprobe.exe | Select-Object -First 1).FullName bin/ffprobe.exe -Force
          ./bin/ffmpeg.exe -version

      - name: Provision bundled ffmpeg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          curl -fL "$url" -o ffmpeg.tar.xz
          mkdir -p ffmpeg_extract bin
          tar -xf ffmpeg.tar.xz -C ffmpeg_extract --strip-components=1
          cp ffmpeg_extract/bin/ffmpeg  bin/ffmpeg
          cp ffmpeg_extract/bin/ffprobe bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe
          ./bin/ffmpeg -version

      - name: Verify bundled ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # macOS использует закоммиченный arm64 bin/ffmpeg — убеждаемся, что он на месте и запускается.
          test -f bin/ffmpeg || { echo "bin/ffmpeg отсутствует в репозитории"; exit 1; }
          chmod +x bin/ffmpeg
          ./bin/ffmpeg -version

      # GigaAM на указанном коммите использует pkg_resources в setup.py.
      # pkg_resources удалён из новых setuptools, поэтому фиксируем последнюю безопасную ветку.
      - name: Upgrade pip toolchain
        run: |
          python -m pip install --upgrade pip wheel "setuptools==81.0.0"
          python -c "import setuptools, pkg_resources; print('setuptools:', setuptools.__version__); print('pkg_resources: OK')"

      # torch в окружении сборки — только для анализа PyInstaller (в бинарник не попадёт).
      - name: Install build-time torch
        run: python -m pip install "torch==2.8.0" "torchaudio==2.8.0" "torchvision==0.23.0" ${{ matrix.torch_index }}

      # Ставим зависимости БЕЗ torchcodec (хрупкая линковка с ffmpeg; приложение
      # использует soundfile) и БЕЗ editable-строки gigaam (её ставим отдельно).
      - name: Install project requirements
        shell: bash
        run: |
          grep -viE '^\s*(-e\s+)?git\+.*gigaam|^\s*torchcodec' requirements.txt > requirements.ci.txt
          python -m pip install -r requirements.ci.txt


      # Portable/offline variants ship live capture rather than asking users to
      # install it into a frozen application — PyInstaller onefile ignores
      # PYTHONPATH and never sees system site-packages (issue #47).
      - name: Install Windows live capture runtime
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-live-windows.txt

      - name: Install macOS live capture runtime
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-live-macos.txt

      - name: Install Linux live capture runtime
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-live-linux.txt
      # gigaam собирается из git и требует уже установленный torch → --no-build-isolation.
      # Перед установкой повторно фиксируем setuptools, чтобы предыдущие pip-операции
      # не могли утащить окружение на setuptools без pkg_resources.
      - name: Install gigaam
        run: |
          python -m pip install --upgrade "setuptools==81.0.0" wheel
          python -c "import pkg_resources; print('pkg_resources: OK before GigaAM install')"
          python -m pip install "git+https://github.com/salute-developers/GigaAM.git@559d88d6b72541412743929f633a6ae7c9950b85#egg=gigaam" --no-build-isolation

      # GPU-wheel содержит также CPUExecutionProvider. Оставляем ровно один
      # дистрибутив: установка GigaAM выше возвращает CPU-wheel своей жёсткой
      # зависимостью, поэтому замену выполняем последней.
      - name: Install GPU ONNX Runtime (Windows/Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          python -m pip uninstall -y onnxruntime onnxruntime-gpu
          python -m pip install --no-cache-dir -r requirements-onnx-gpu.txt
          python - <<'PY'
          import importlib.metadata
          import onnxruntime

          assert importlib.metadata.version("onnxruntime-gpu") == "1.23.2"
          assert callable(onnxruntime.preload_dlls)
          providers = onnxruntime.get_available_providers()
          assert "CUDAExecutionProvider" in providers, providers
          assert "CPUExecutionProvider" in providers, providers
          print("ONNX Runtime GPU providers:", providers)
          PY

      - name: Verify macOS CoreML ONNX Runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          import onnxruntime

          assert importlib.metadata.version("onnxruntime") == "1.23.2"
          providers = onnxruntime.get_available_providers()
          assert "CoreMLExecutionProvider" in providers, providers
          assert "CPUExecutionProvider" in providers, providers
          print("ONNX Runtime macOS providers:", providers)
          PY

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Test runtime and processor compatibility layer
        run: >-
          python -m pytest
          tests/test_runtime_patches.py
          tests/test_torch_downloader.py
          tests/test_runtime_manager.py
          tests/test_selfcheck.py
          tests/test_packaging_runtime_deps.py
          tests/test_sortformer_onnx.py
          tests/test_app_sortformer_smoke.py
          tests/test_processor_progress.py
          tests/test_subtitles.py
          tests/test_formatters.py
          tests/test_diarization_mapping.py
          tests/test_cli_backend.py
          tests/test_tui_worker.py
          tests/test_web_app_persistence.py
          tests/test_data_paths.py
          tests/test_portable_data_interfaces.py
          tests/test_gui_data_directory.py
          tests/test_app_boot.py
          tests/test_download_models.py
          -q

      - name: Build (PyInstaller, portable spec)
        run: python -m PyInstaller packaging/gigaam_app_portable.spec --noconfirm

      # Гейт: гоняем СОБРАННЫЙ бинарь с --selfcheck. Он скачивает torch под ОС и
      # импортирует всю цепочку (torchvision→PIL, pyannote→sincnet→asteroid, docx).
      # Любая недостающая зависимость сборки → job падает, релиз не публикуется (issue #19).
      - name: Smoke-test built binary (import self-check)
        shell: bash
        timeout-minutes: 20
        env:
          GIGAAM_RUNTIME_DIR: ${{ runner.temp }}/gigaam_selfcheck
        run: |
          BIN="${{ matrix.built }}"
          chmod +x "$BIN" || true
          if ! "$BIN" --selfcheck; then
            echo "=== selfcheck.log ==="
            cat "$GIGAAM_RUNTIME_DIR/selfcheck.log" 2>/dev/null || echo "(no selfcheck.log written)"
            exit 1
          fi

      - name: Smoke-test Windows Sortformer ONNX and Linux CPU fallback
        if: runner.os != 'macOS'
        shell: bash
        timeout-minutes: 20
        env:
          GIGAAM_RUNTIME_DIR: ${{ runner.temp }}/gigaam_sortformer_onnx
        run: |
          BIN="${{ matrix.built }}"
          "$BIN" --sortformer-onnx-smoke

      - name: Smoke-test macOS Sortformer ONNX CoreML
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 20
        env:
          GIGAAM_RUNTIME_DIR: ${{ runner.temp }}/gigaam_sortformer_coreml
          GIGAAM_SMOKE_ONNX_PROVIDER: coreml
        run: |
          BIN="${{ matrix.built }}"
          chmod +x "$BIN"
          "$BIN" --sortformer-onnx-smoke

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.asset }}"

      - name: Make executable (macOS/Linux)
        if: runner.os != 'Windows'
        run: chmod +x "out/${{ matrix.asset }}"

      # Офлайн-вариант: тот же бинарник плюс папка models рядом с ним. Внутрь
      # onefile модели не вшиваем — иначе 884 МБ распаковывались бы во временный
      # каталог при каждом запуске.
      - name: Assemble offline bundle
        shell: bash
        run: |
          python scripts/build_offline_models.py --output offline/models/hf
          cp "out/${{ matrix.asset }}" "offline/${{ matrix.asset }}"

      # Гейт офлайн-артефакта: гоняем СОБРАННЫЙ бинарь с пустым кэшем и
      # HF_HUB_OFFLINE=1. Если хоть одна модель не нашлась рядом, job падает —
      # иначе «офлайн»-сборка молча ушла бы в релиз, продолжая ходить в сеть.
      - name: Smoke-test offline bundle (no network for models)
        shell: bash
        timeout-minutes: 20
        env:
          GIGAAM_DATA_DIR: ${{ runner.temp }}/gigaam_offline/data
          GIGAAM_RUNTIME_DIR: ${{ runner.temp }}/gigaam_offline
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          BIN="offline/${{ matrix.asset }}"
          chmod +x "$BIN" || true
          "$BIN" --offline-models-smoke

      - name: Archive offline bundle (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p out
          chmod +x "offline/${{ matrix.asset }}"
          (cd offline && zip -qr "../out/${{ matrix.offline_asset }}" .)

      - name: Archive offline bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path offline/* -DestinationPath "out/${{ matrix.offline_asset }}" -Force

      - name: Check offline bundle size
        shell: bash
        run: |
          ARCHIVE="out/${{ matrix.offline_asset }}"
          ARCHIVE_BYTES=$(python -c "import os,sys; print(os.path.getsize(sys.argv[1]))" "$ARCHIVE")
          MAX_RELEASE_ASSET_BYTES=$((2 * 1024 * 1024 * 1024))
          echo "офлайн-архив: $((ARCHIVE_BYTES / 1024 / 1024)) МБ"
          test "$ARCHIVE_BYTES" -lt "$MAX_RELEASE_ASSET_BYTES" || {
            echo "Офлайн-архив слишком велик для GitHub Release: $ARCHIVE_BYTES байт"
            exit 1
          }

      - name: Upload offline artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.offline_asset }}
          path: out/${{ matrix.offline_asset }}
          if-no-files-found: error
          compression-level: 0


      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error


  build-macos-full:
    name: macOS arm64 full app bundle
    runs-on: macos-14
    needs: test-tui
    timeout-minutes: 60
    env:
      GIGAAM_BUNDLE_SORTFORMER: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify bundled ffmpeg
        shell: bash
        run: |
          test -f bin/ffmpeg || { echo "bin/ffmpeg отсутствует в репозитории"; exit 1; }
          chmod +x bin/ffmpeg
          ./bin/ffmpeg -version

      - name: Upgrade pip toolchain
        run: python -m pip install --upgrade pip wheel "setuptools==81.0.0"

      - name: Install bundled runtime dependencies
        shell: bash
        run: |
          python -m pip install "torch==2.8.0" "torchaudio==2.8.0" "torchvision==0.23.0"
          grep -viE '^\s*(-e\s+)?git\+.*gigaam|^\s*torchcodec' requirements.txt > requirements.ci.txt
          python -m pip install -r requirements.ci.txt
          python -m pip install --upgrade "setuptools==81.0.0" wheel
          python -m pip install "git+https://github.com/salute-developers/GigaAM.git@559d88d6b72541412743929f633a6ae7c9950b85#egg=gigaam" --no-build-isolation
          python -m pip install -r requirements-macos-mlx.txt
          python -m pip install -r requirements-sortformer.txt
          python -m pip install -r requirements-live-macos.txt
          python -m pip install --upgrade pyinstaller

      - name: Test macOS packaging configuration
        run: python -m pytest tests/test_macos_packaging_config.py tests/test_packaging_runtime_deps.py -q

      - name: Build and verify full app bundle
        run: bash packaging/build_exe_mac.sh

      - name: Verify release version and archive full app
        id: archive
        shell: bash
        run: |
          BUNDLE="dist/GigaAMTranscriber.app"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
            ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$BUNDLE/Contents/Info.plist")
            test "$ACTUAL_VERSION" = "$EXPECTED_VERSION" || {
              echo "Версия .app ($ACTUAL_VERSION) не совпадает с тегом ($EXPECTED_VERSION)"
              exit 1
            }
          fi

          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          ARCHIVE="out/GigaAMTranscriber-macos-app-${SAFE_REF_NAME}.zip"
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE" "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          ARCHIVE_BYTES=$(stat -f%z "$ARCHIVE")
          MAX_RELEASE_ASSET_BYTES=$((2 * 1024 * 1024 * 1024))
          test "$ARCHIVE_BYTES" -lt "$MAX_RELEASE_ASSET_BYTES" || {
            echo "Архив слишком велик для GitHub Release: $ARCHIVE_BYTES байт"
            exit 1
          }
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$ARCHIVE_BYTES" >> "$GITHUB_OUTPUT"

      - name: Upload full app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          compression-level: 0


      # Офлайн-вариант: тот же .app плюс папка models рядом с ним. Внутрь
      # бандла модели не кладём, чтобы не ломать подпись при докачке остальных.
      - name: Archive offline full app
        id: archive_offline
        shell: bash
        run: |
          python scripts/build_offline_models.py --output offline/models/hf
          ditto dist/GigaAMTranscriber.app offline/GigaAMTranscriber.app

          # Тот же гейт, что и для портативных сборок: модели обязаны найтись
          # рядом с .app, без обращения к сети.
          env GIGAAM_DATA_DIR="${RUNNER_TEMP}/gigaam_offline/data" \
              GIGAAM_RUNTIME_DIR="${RUNNER_TEMP}/gigaam_offline" \
              HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
              offline/GigaAMTranscriber.app/Contents/MacOS/GigaAMTranscriber \
              --offline-models-smoke

          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          ARCHIVE="out/GigaAMTranscriber-macos-app-offline-${SAFE_REF_NAME}.zip"
          mkdir -p out
          ditto -c -k --sequesterRsrc offline "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          ARCHIVE_BYTES=$(stat -f%z "$ARCHIVE")
          MAX_RELEASE_ASSET_BYTES=$((2 * 1024 * 1024 * 1024))
          test "$ARCHIVE_BYTES" -lt "$MAX_RELEASE_ASSET_BYTES" || {
            echo "Офлайн-архив слишком велик для GitHub Release: $ARCHIVE_BYTES байт"
            exit 1
          }
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"

      - name: Upload offline full app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive_offline.outputs.name }}
          path: ${{ steps.archive_offline.outputs.path }}
          if-no-files-found: error
          compression-level: 0


  build-macos-intel:
    name: macOS x86_64 (Intel) ONNX app bundle
    runs-on: macos-15-intel
    needs: test-tui
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip

      # Закоммиченный bin/ffmpeg собран под arm64: на Intel он просто не
      # запускается, а внутри бандла уронил бы гейт «все Mach-O — x86_64».
      # Кладём статическую x86_64-сборку поверх, как это делают Windows- и
      # Linux-джобы, и проверяем архитектуру сразу — молча приехавший arm64
      # означал бы неработающую конвертацию уже у пользователя.
      - name: Provision bundled ffmpeg (macOS x86_64)
        shell: bash
        run: |
          mkdir -p bin ffmpeg_extract
          for tool in ffmpeg ffprobe; do
            curl -fL "https://evermeet.cx/ffmpeg/getrelease/$tool/zip" -o "ffmpeg_extract/$tool.zip"
            unzip -o -q "ffmpeg_extract/$tool.zip" -d ffmpeg_extract
            mv "ffmpeg_extract/$tool" "bin/$tool"
            chmod +x "bin/$tool"
            TOOL_ARCH=$(lipo -archs "bin/$tool")
            test "$TOOL_ARCH" = "x86_64" || {
              echo "$tool собран под $TOOL_ARCH, нужен x86_64"
              exit 1
            }
          done
          ./bin/ffmpeg -version
          ./bin/ffprobe -version

      - name: Upgrade pip toolchain
        run: python -m pip install --upgrade pip wheel "setuptools==81.0.0"

      # Никакого torch и никакого mlx: под macOS x86_64 их колёс нет, и вся
      # цепочка (ASR, VAD, диаризация) идёт через onnx-asr + ONNX Runtime.
      #
      # --only-binary=:all: — не оптимизация, а гейт. Часть проекта уже перестала
      # выпускать колёса под x86_64 (numba 0.67, llvmlite 0.49 — только Apple
      # Silicon), и без этого флага pip молча уходит собирать их из исходников:
      # сборка падает где-то в CMake через несколько минут, а причина видна не
      # сразу. Пусть лучше падает сразу и по делу.
      - name: Install ONNX-only runtime dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-macos-x86_64.txt
          python -m pip install --only-binary=:all: -r requirements-live-macos.txt
          python -m pip install --upgrade pyinstaller
          # pytest ставим отдельно: requirements-macos-x86_64.txt — это набор для
          # бандла, а pytest в бандле не нужен и явно выключен в спеке. Остальные
          # джобы получают его транзитивно из requirements.txt.
          python -m pip install --only-binary=:all: "pytest==9.0.1"

      - name: Assert the build environment stays torch-free
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          leaked = [name for name in ("torch", "mlx", "gigaam", "pyannote")
                    if importlib.util.find_spec(name) is not None]
          if leaked:
              sys.exit(f"Intel-сборка не должна видеть эти пакеты: {leaked}")
          print("build environment is torch-free")
          PY

      - name: Test macOS packaging configuration
        run: python -m pytest tests/test_macos_x86_64_packaging.py tests/test_packaging_runtime_deps.py -q

      - name: Build and verify Intel app bundle
        run: bash packaging/build_exe_mac_x86_64.sh

      - name: Verify release version and architecture
        shell: bash
        run: |
          BUNDLE="dist/GigaAMTranscriber.app"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
            ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$BUNDLE/Contents/Info.plist")
            test "$ACTUAL_VERSION" = "$EXPECTED_VERSION" || {
              echo "Версия .app ($ACTUAL_VERSION) не совпадает с тегом ($EXPECTED_VERSION)"
              exit 1
            }
          fi
          ARCHS=$(lipo -archs "$BUNDLE/Contents/MacOS/GigaAMTranscriber")
          test "$ARCHS" = "x86_64" || {
            echo "Ожидался x86_64, собрано: $ARCHS"
            exit 1
          }

      # Публикуем только офлайн-вариант: без torch модели обязаны лежать рядом
      # с .app, иначе на Intel-маке приложению нечем распознавать.
      - name: Archive offline Intel app
        id: archive_offline
        shell: bash
        run: |
          python scripts/build_offline_models.py --output offline/models/hf
          ditto dist/GigaAMTranscriber.app offline/GigaAMTranscriber.app

          # Тот же гейт, что и для остальных офлайн-сборок: модели обязаны
          # найтись рядом с .app, без обращения к сети. Он же проверяет, что
          # дефолтные бэкенды в замороженной Intel-сборке — onnx.
          env GIGAAM_DATA_DIR="${RUNNER_TEMP}/gigaam_offline/data" \
              GIGAAM_RUNTIME_DIR="${RUNNER_TEMP}/gigaam_offline" \
              HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
              offline/GigaAMTranscriber.app/Contents/MacOS/GigaAMTranscriber \
              --offline-models-smoke

          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          ARCHIVE="out/GigaAMTranscriber-macos-x86_64-app-offline-${SAFE_REF_NAME}.zip"
          mkdir -p out
          ditto -c -k --sequesterRsrc offline "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          ARCHIVE_BYTES=$(stat -f%z "$ARCHIVE")
          MAX_RELEASE_ASSET_BYTES=$((2 * 1024 * 1024 * 1024))
          test "$ARCHIVE_BYTES" -lt "$MAX_RELEASE_ASSET_BYTES" || {
            echo "Офлайн-архив слишком велик для GitHub Release: $ARCHIVE_BYTES байт"
            exit 1
          }
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"

      - name: Upload offline Intel app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive_offline.outputs.name }}
          path: ${{ steps.archive_offline.outputs.path }}
          if-no-files-found: error
          compression-level: 0


  build-macos-swift:
    name: Native Swift macOS arm64 app
    # NSGlassEffectView is provided by the macOS 26 SDK. The executable keeps
    # a macOS 13 deployment target and guards the glass path with #available.
    runs-on: macos-26
    needs: [test-tui, build-macos-full]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download online Python companion
        uses: actions/download-artifact@v8
        with:
          path: companion-online
          pattern: GigaAMTranscriber-macos-app-v*
          merge-multiple: true

      - name: Download offline Python companion
        uses: actions/download-artifact@v8
        with:
          path: companion-offline
          pattern: GigaAMTranscriber-macos-app-offline-*
          merge-multiple: true

      - name: Build native Swift client
        run: swift build -c release --package-path macos/GigaAMLiquid

      - name: Assemble and verify app bundle
        id: archive
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/^APP_VERSION = "\([^"]*\)"/\1/p' packaging/_spec_common.py)
          fi
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          PRODUCT="GigaAMLiquid-macos-arm64-${SAFE_REF_NAME}"
          APP="stage/$PRODUCT/GigaAMLiquid.app"
          EXECUTABLE="macos/GigaAMLiquid/.build/release/GigaAMLiquid"

          test -x "$EXECUTABLE"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$EXECUTABLE" "$APP/Contents/MacOS/GigaAMLiquid"
          chmod +x "$APP/Contents/MacOS/GigaAMLiquid"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>ru</string>
            <key>CFBundleExecutable</key><string>GigaAMLiquid</string>
            <key>CFBundleIdentifier</key><string>ru.dubr1k.gigaam-liquid</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>GigaAMLiquid</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>GigaAMLiquid uses microphone access for live transcription.</string>
          </dict>
          </plist>
          PLIST

          # Ship only the frozen companion application. The release must not
          # expose the repository sources or require a separate Python install.
          COMPANION_ARCHIVE=$(find companion-online -type f -name 'GigaAMTranscriber-macos-app-v*.zip' -print -quit)
          test -n "$COMPANION_ARCHIVE"
          unzip -q "$COMPANION_ARCHIVE" -d "stage/$PRODUCT"
          COMPANION="stage/$PRODUCT/GigaAMTranscriber.app/Contents/MacOS/GigaAMTranscriber"
          test -x "$COMPANION"
          test ! -e "stage/$PRODUCT/app.py"
          test ! -e "stage/$PRODUCT/src"
          printf '{"type":"ping"}\n' | "$COMPANION" --native-worker > "${RUNNER_TEMP}/native-worker-online.jsonl"
          grep -q '"type": "pong"' "${RUNNER_TEMP}/native-worker-online.jsonl"

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(lipo -archs "$APP/Contents/MacOS/GigaAMLiquid")" = "arm64"

          mkdir -p out
          ARCHIVE="out/$PRODUCT.zip"
          ditto -c -k --sequesterRsrc --keepParent "stage/$PRODUCT" "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"

      - name: Upload native Swift artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          compression-level: 0

      - name: Assemble and verify offline native Swift archive
        id: archive_offline
        shell: bash
        run: |
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          PRODUCT="GigaAMLiquid-macos-arm64-${SAFE_REF_NAME}"
          OFFLINE_PRODUCT="GigaAMLiquid-macos-arm64-offline-${SAFE_REF_NAME}"
          ROOT="stage/$OFFLINE_PRODUCT"
          SWIFT_APP="$ROOT/GigaAMLiquid.app"

          mkdir -p "$ROOT"
          ditto "stage/$PRODUCT/GigaAMLiquid.app" "$SWIFT_APP"

          COMPANION_ARCHIVE=$(find companion-offline -type f -name 'GigaAMTranscriber-macos-app-offline-*.zip' -print -quit)
          test -n "$COMPANION_ARCHIVE"
          unzip -q "$COMPANION_ARCHIVE" -d "$ROOT"

          COMPANION="$ROOT/GigaAMTranscriber.app/Contents/MacOS/GigaAMTranscriber"
          test -x "$COMPANION"
          test -d "$ROOT/models/hf"
          test -n "$(find "$ROOT/models/hf" -type f -print -quit)"
          test ! -e "$ROOT/app.py"
          test ! -e "$ROOT/src"
          test "$(lipo -archs "$COMPANION")" = "arm64"
          codesign --verify --deep --strict "$SWIFT_APP"

          printf '{"type":"ping"}\n' | "$COMPANION" --native-worker > "${RUNNER_TEMP}/native-worker.jsonl"
          grep -q '"type": "pong"' "${RUNNER_TEMP}/native-worker.jsonl"

          ARCHIVE="out/$OFFLINE_PRODUCT.zip"
          ditto -c -k --sequesterRsrc --keepParent "$ROOT" "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          ARCHIVE_BYTES=$(stat -f%z "$ARCHIVE")
          MAX_RELEASE_ASSET_BYTES=$((2 * 1024 * 1024 * 1024))
          test "$ARCHIVE_BYTES" -lt "$MAX_RELEASE_ASSET_BYTES" || {
            echo "Liquid offline archive is too large for GitHub Release: $ARCHIVE_BYTES bytes"
            exit 1
          }
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"

      - name: Upload offline native Swift artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive_offline.outputs.name }}
          path: ${{ steps.archive_offline.outputs.path }}
          if-no-files-found: error
          compression-level: 0


  test-tui:
    name: TUI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test TUI
        working-directory: tui
        run: cargo test --locked

  publish-release:
    name: Publish release after all artifacts complete
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-macos-full, build-macos-intel, build-macos-swift]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5

      - name: Resolve matching release notes
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/RELEASE_NOTES_${VERSION}.md"
          test -f "$NOTES" || {
            echo "Missing release notes: $NOTES" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Download completed release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: GigaAM*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Только номер версии: имя продукта в заголовке релиза не дублируем.
          name: ${{ steps.notes.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: release-assets/*
          overwrite_files: true
