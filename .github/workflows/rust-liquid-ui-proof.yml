name: Rust Liquid packaged UI proof

# workflow_run is active only once this workflow exists on the default branch.
# Manual dispatch accepts a successful, trusted candidate-build run ID. Never
# execute a PR/fork artifact in this privileged workflow_run context.
on:
  push:
    branches: [feat/rust-liquid-windows-linux]
    paths: [".github/workflows/rust-liquid-ui-proof.yml", ".github/workflows/rust-liquid.yml", ".github/workflows/build.yml", "desktop/**", "packaging/rust-liquid/**", "tests/fixtures/rust_liquid_long_sources.json", "tests/fixtures/rust_liquid_community_smoke.json"]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Rust Liquid candidate build run ID
        type: string
        required: true
  workflow_run:
    workflows: ["Rust Liquid candidate builds"]
    types: [completed]
    branches: [main, feat/rust-liquid-windows-linux]

permissions:
  actions: read
  contents: read

jobs:
  packaged-ui:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event))
    name: Installed candidate UI (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # Includes the long-path proof, clean model downloads and the Community-1 UI proof.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            asset: GigaAMGUI-Rust-Liquid-linux-x64.AppImage
          - os: windows-2022
            platform: windows-x64
            asset: GigaAMGUI-Rust-Liquid-windows-x64-setup.exe
    steps:
      - name: Validate the source run before downloading executable artifacts
        id: source
        uses: actions/github-script@v8
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        with:
          script: |
            let id = process.env.SOURCE_RUN_ID;
            if (!id && context.eventName === 'push') {
              const deadline = Date.now() + 50 * 60 * 1000;
              while (Date.now() < deadline) {
                const {data} = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: 'rust-liquid.yml',
                  branch: context.ref.replace(/^refs\/heads\//, ''), event: 'push', per_page: 100,
                });
                const matches = data.workflow_runs.filter(item => item.head_sha === context.sha);
                const success = matches.find(item => item.status === 'completed' && item.conclusion === 'success');
                if (success) { id = String(success.id); break; }
                if (matches.length && matches.every(item => item.status === 'completed')) {
                  throw new Error('Candidate build failed for this proof revision');
                }
                await new Promise(resolve => setTimeout(resolve, 30000));
              }
            }
            if (!/^[1-9][0-9]*$/.test(id || '') || !Number.isSafeInteger(Number(id))) {
              throw new Error('No successful candidate run ID for this proof revision');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(id),
            });
            const branches = ['main', 'feat/rust-liquid-windows-linux'];
            if (run.path !== '.github/workflows/rust-liquid.yml' ||
                run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !branches.includes(run.head_branch) ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                run.status !== 'completed' || run.conclusion !== 'success' ||
                !/^[0-9a-f]{40}$/.test(run.head_sha)) {
              throw new Error(`Untrusted or unsuccessful candidate build run ${id}`);
            }
            if (context.sha !== run.head_sha) {
              throw new Error(`Proof workflow revision ${context.sha} does not match candidate ${run.head_sha}`);
            }
            core.setOutput('run_id', id);
            core.setOutput('sha', run.head_sha);
            core.info(`Using candidate run ${id}, source ${run.head_sha}, event ${run.event}`);
      - name: Check out the trusted proof harness
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the checked-out proof harness revision
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          harness_sha="$(git rev-parse HEAD)"
          if [ "$harness_sha" != "$CANDIDATE_SHA" ]; then
            echo "Proof harness revision $harness_sha does not match candidate $CANDIDATE_SHA" >&2
            exit 1
          fi
      - name: Check out the fixture at the candidate's source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: candidate-source
          persist-credentials: false
      - name: Download the actual candidate package
        uses: actions/download-artifact@v7
        with:
          name: rust-liquid-${{ matrix.platform }}-candidate
          path: candidate-package
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Hash the downloaded candidate package before installation
        id: package_hash
        uses: actions/github-script@v8
        env:
          ASSET: ${{ matrix.asset }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const assetPath = path.join(process.env.GITHUB_WORKSPACE, 'candidate-package', process.env.ASSET);
            const stat = await fs.promises.lstat(assetPath);
            if (!stat.isFile() || stat.size === 0) throw new Error('Candidate package is missing or empty');
            const hash = crypto.createHash('sha256');
            for await (const chunk of fs.createReadStream(assetPath)) hash.update(chunk);
            core.setOutput('sha256', hash.digest('hex'));
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Windows input desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: python packaging/rust-liquid/ui-proof.py --check-display
      - name: Install Linux GUI and packaged-app runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            webkit2gtk-driver xvfb xauth xdotool x11-utils openbox \
            python3-pyatspi dbus-x11 scrot libpulse0 libegl1 libgles2
      - name: Install Windows native dialog automation
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install 'pywinauto==0.6.9'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri's WebDriver intermediary
        shell: bash
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Extract the Linux AppImage without FUSE
        if: runner.os == 'Linux'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          image="$GITHUB_WORKSPACE/candidate-package/$ASSET"
          test -s "$image"
          chmod +x "$image"
          mkdir "$RUNNER_TEMP/rust-liquid-package"
          (cd "$RUNNER_TEMP/rust-liquid-package" && "$image" --appimage-extract > /dev/null)
          root="$RUNNER_TEMP/rust-liquid-package/squashfs-root"
          test -x "$root/AppRun"
          if find "$root" -type f \( -iname 'python' -o -iname 'python[0-9]*' -o -iname 'libpython*.so*' \) -print -quit | grep -q .; then
            echo 'Unexpected Python runtime in candidate AppImage' >&2
            exit 1
          fi
          echo "PROOF_APP=$root/AppRun" >> "$GITHUB_ENV"
      - name: Install the Windows NSIS candidate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:GITHUB_WORKSPACE "candidate-package/$env:ASSET"
          $install = Join-Path $env:RUNNER_TEMP 'rust-liquid-install'
          if (!(Test-Path -PathType Leaf $installer)) { throw 'Candidate NSIS installer is missing' }
          if ($install -match '\s') { throw 'NSIS /D requires a temporary installation path without spaces' }
          $process = Start-Process -FilePath $installer -ArgumentList "/S /D=$install" -PassThru
          if (!$process.WaitForExit(300000)) { $process.Kill(); throw 'NSIS installation timed out after 300 seconds' }
          if ($process.ExitCode -ne 0) { throw "NSIS installer exited with $($process.ExitCode)" }
          $apps = @(Get-ChildItem $install -Recurse -File -Filter 'gigaam-desktop.exe')
          if ($apps.Count -ne 1) { throw 'Expected exactly one installed gigaam-desktop.exe' }
          $python = @(Get-ChildItem $install -Recurse -File | Where-Object {
            $_.Name -match '^(pythonw?(\d+)?\.(exe|dll)|pyvenv\.cfg)$'
          })
          if ($python.Count) { throw 'Unexpected Python runtime in installed candidate' }
          "PROOF_APP=$($apps[0].FullName)" >> $env:GITHUB_ENV
      - name: Install the WebDriver matching the installed WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $locations = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$key",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$key"
          )
          $versions = @($locations | ForEach-Object {
            if (Test-Path $_) { (Get-ItemProperty $_ -Name pv -ErrorAction SilentlyContinue).pv }
          } | Where-Object { $_ -and $_ -ne '0.0.0.0' } | Sort-Object -Unique)
          if ($versions.Count -ne 1 -or $versions[0] -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Cannot determine one installed WebView2 runtime version: $($versions -join ', ')"
          }
          $version = $versions[0]
          $archive = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $driverDir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Invoke-WebRequest -UseBasicParsing "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $driverDir
          $drivers = @(Get-ChildItem $driverDir -Recurse -File -Filter 'msedgedriver.exe')
          if ($drivers.Count -ne 1) { throw 'Expected one downloaded msedgedriver.exe' }
          $signature = Get-AuthenticodeSignature $drivers[0].FullName
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'Microsoft Edge WebDriver signature is not valid'
          }
          $drivers[0].DirectoryName >> $env:GITHUB_PATH
          Write-Host "WebView2 and downloaded Edge WebDriver version: $version"
      - name: Exercise Linux UI and save a real transcript
        if: runner.os == 'Linux'
        shell: bash
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' sh -c '
            openbox > "$RUNNER_TEMP/rust-liquid-openbox.log" 2>&1 &
            exec /usr/bin/python3 packaging/rust-liquid/ui-proof.py \
              --app "$PROOF_APP" \
              --fixture "$GITHUB_WORKSPACE/candidate-source/tests/fixtures/liquid_smoke.wav" \
              --diagnostics "$GITHUB_WORKSPACE/ui-proof-diagnostics" --timeout 1800
          '
      - name: Isolate Windows Tauri known folders
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'rust-liquid-long-app-data'
          if (Test-Path -LiteralPath $root) { throw 'Long proof app-data root already exists' }
          $roaming = [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData)
          $local = [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)
          if (!$roaming -or !$local) { throw 'Windows app-data known folders are unavailable' }
          $links = @(
            @{ Name = 'PROOF_ROAMING_LINK'; Path = (Join-Path $roaming 'ru.gigaam.gui.rustliquid'); Target = (Join-Path $root 'roaming/ru.gigaam.gui.rustliquid') },
            @{ Name = 'PROOF_LOCAL_LINK'; Path = (Join-Path $local 'ru.gigaam.gui.rustliquid'); Target = (Join-Path $root 'local/ru.gigaam.gui.rustliquid') }
          )
          foreach ($link in $links) {
            if (Test-Path -LiteralPath $link.Path) { throw "Tauri app-data path already exists: $($link.Path)" }
          }
          New-Item -ItemType Directory -Path $root | Out-Null
          "PROOF_APP_DATA=$root" >> $env:GITHUB_ENV
          foreach ($link in $links) {
            New-Item -ItemType Directory -Path $link.Target -Force | Out-Null
            New-Item -ItemType Junction -Path $link.Path -Target $link.Target | Out-Null
            "$($link.Name)=$($link.Path)" >> $env:GITHUB_ENV
            Write-Host "Tauri known-folder path $($link.Path) -> $($link.Target)"
          }
      - name: Verify automatic Community-1 delivery through the installed Linux UI
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          export PROOF_AUTO_APP_DATA="$(mktemp -d "$RUNNER_TEMP/rust-liquid-community-auto.XXXXXX")"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' sh -c '
            openbox > "$RUNNER_TEMP/rust-liquid-openbox.log" 2>&1 &
            exec /usr/bin/python3 packaging/rust-liquid/ui-proof.py \
              --app "$PROOF_APP" --app-data "$PROOF_AUTO_APP_DATA" --community-download \
              --fixture "$GITHUB_WORKSPACE/candidate-source/tests/fixtures/liquid_smoke.wav" \
              --diagnostics "$GITHUB_WORKSPACE/ui-proof-diagnostics/community-download" --timeout 600
          '
      - name: Verify automatic Community-1 delivery through the installed Windows UI
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python packaging/rust-liquid/ui-proof.py `
            --app "$env:PROOF_APP" --app-data "$env:PROOF_APP_DATA" --community-download `
            --fixture "$env:GITHUB_WORKSPACE/candidate-source/tests/fixtures/liquid_smoke.wav" `
            --diagnostics "$env:GITHUB_WORKSPACE/ui-proof-diagnostics/community-download" --timeout 600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Retain the proof-owned data and restore empty targets for the existing proofs.
          $expectedRoot = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'rust-liquid-long-app-data'))
          if ([IO.Path]::GetFullPath($env:PROOF_APP_DATA) -ne $expectedRoot) { throw 'Unexpected proof app-data root' }
          $holding = Join-Path $env:RUNNER_TEMP 'rust-liquid-community-auto-app-data'
          if (Test-Path -LiteralPath $holding) { throw 'Community-1 proof holding directory already exists' }
          $targets = @(
            @{ Name = 'roaming'; Link = $env:PROOF_ROAMING_LINK; Target = (Join-Path $expectedRoot 'roaming/ru.gigaam.gui.rustliquid') },
            @{ Name = 'local'; Link = $env:PROOF_LOCAL_LINK; Target = (Join-Path $expectedRoot 'local/ru.gigaam.gui.rustliquid') }
          )
          foreach ($target in $targets) {
            $link = Get-Item -LiteralPath $target.Link -Force
            if ($link.LinkType -ne 'Junction' -or $link.Target -ne $target.Target -or
                !(Test-Path -LiteralPath $target.Target -PathType Container)) {
              throw "Unexpected proof junction or target: $($target.Link)"
            }
          }
          New-Item -ItemType Directory -Path $holding | Out-Null
          foreach ($target in $targets) {
            Move-Item -LiteralPath $target.Target -Destination (Join-Path $holding $target.Name)
            New-Item -ItemType Directory -Path $target.Target | Out-Null
          }
      - name: Exercise Windows UI and save a real transcript
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python packaging/rust-liquid/ui-proof.py `
            --app "$env:PROOF_APP" `
            --fixture "$env:GITHUB_WORKSPACE/candidate-source/tests/fixtures/liquid_smoke.wav" `
            --app-data "$env:PROOF_APP_DATA" `
            --diagnostics "$env:GITHUB_WORKSPACE/ui-proof-diagnostics" --timeout 1800
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify incomplete Community-1 bundle through the installed Linux UI
        if: runner.os == 'Linux'
        shell: bash
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' sh -c '
            openbox > "$RUNNER_TEMP/rust-liquid-openbox.log" 2>&1 &
            exec /usr/bin/python3 packaging/rust-liquid/ui-proof.py \
              --app "$PROOF_APP" --community-missing \
              --fixture "$GITHUB_WORKSPACE/candidate-source/tests/fixtures/liquid_smoke.wav" \
              --diagnostics "$GITHUB_WORKSPACE/ui-proof-diagnostics/community-missing" --timeout 1800
          '
      - name: Verify incomplete Community-1 bundle through the installed Windows UI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python packaging/rust-liquid/ui-proof.py `
            --app "$env:PROOF_APP" --app-data "$env:PROOF_APP_DATA" --community-missing `
            --fixture "$env:GITHUB_WORKSPACE/candidate-source/tests/fixtures/liquid_smoke.wav" `
            --diagnostics "$env:GITHUB_WORKSPACE/ui-proof-diagnostics/community-missing" --timeout 1800
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Linux long-proof models through the installed UI
        if: runner.os == 'Linux'
        timeout-minutes: 40
        shell: bash
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          export PROOF_APP_DATA="$RUNNER_TEMP/rust-liquid-long-app-data"
          test ! -e "$PROOF_APP_DATA"
          mkdir "$PROOF_APP_DATA"
          echo "PROOF_APP_DATA=$PROOF_APP_DATA" >> "$GITHUB_ENV"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' sh -c '
            openbox > "$RUNNER_TEMP/rust-liquid-openbox.log" 2>&1 &
            exec /usr/bin/python3 packaging/rust-liquid/ui-proof.py \
              --app "$PROOF_APP" \
              --fixture "$GITHUB_WORKSPACE/candidate-source/tests/fixtures/liquid_smoke.wav" \
              --app-data "$PROOF_APP_DATA" --model multilingual_ctc --diarization \
              --diagnostics "$GITHUB_WORKSPACE/ui-proof-diagnostics/model-prepare" --timeout 1800
          '
      - name: Prepare Windows long-proof models through the installed UI
        if: runner.os == 'Windows'
        timeout-minutes: 40
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:PROOF_APP_DATA
          if (!(Test-Path -PathType Container $root)) { throw 'Long proof app-data root is missing' }
          python packaging/rust-liquid/ui-proof.py `
            --app "$env:PROOF_APP" `
            --fixture "$env:GITHUB_WORKSPACE/candidate-source/tests/fixtures/liquid_smoke.wav" `
            --app-data "$root" --model multilingual_ctc --diarization `
            --diagnostics "$env:GITHUB_WORKSPACE/ui-proof-diagnostics/model-prepare" --timeout 1800
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision pinned Linux segmentation model
        if: runner.os == 'Linux'
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          dir="$PROOF_APP_DATA/data/ru.gigaam.gui.rustliquid/models/multilingual_ctc"
          test -d "$dir"
          test ! -e "$dir/powerset_fp32_tract.onnx"
          temporary="$(mktemp "$dir/.long-proof-segmentation.XXXXXX")"
          trap 'rm -f "$temporary"' EXIT
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 600 \
            'https://github.com/ekhodzitsky/polyvoice/releases/download/models-tract-v1/powerset_fp32_tract.onnx' \
            -o "$temporary"
          echo "d5335de334a24470b1f0326f72e513c59e156308a78ba3e1626851f570696ce4  $temporary" | sha256sum -c -
          mv "$temporary" "$dir/powerset_fp32_tract.onnx"
          trap - EXIT
      - name: Provision pinned Windows segmentation model
        if: runner.os == 'Windows'
        timeout-minutes: 12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:PROOF_APP_DATA 'roaming/ru.gigaam.gui.rustliquid/models/multilingual_ctc'
          if (!(Test-Path -PathType Container $dir)) { throw 'Prepared model directory is missing' }
          $target = Join-Path $dir 'powerset_fp32_tract.onnx'
          $temporary = Join-Path $dir '.long-proof-segmentation.download'
          if ((Test-Path $target) -or (Test-Path $temporary)) { throw 'Segmentation model or temporary file already exists' }
          try {
            Invoke-WebRequest -UseBasicParsing -TimeoutSec 600 `
              'https://github.com/ekhodzitsky/polyvoice/releases/download/models-tract-v1/powerset_fp32_tract.onnx' `
              -OutFile $temporary
            if ((Get-FileHash -Algorithm SHA256 $temporary).Hash -ne 'd5335de334a24470b1f0326f72e513c59e156308a78ba3e1626851f570696ce4') {
              throw 'Segmentation model SHA-256 mismatch'
            }
            Move-Item -LiteralPath $temporary -Destination $target
          } finally {
            if (Test-Path $temporary) { Remove-Item -LiteralPath $temporary -Force }
          }
      - name: Exercise Linux packaged long diarization
        if: runner.os == 'Linux'
        timeout-minutes: 80
        shell: bash
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' sh -c '
            openbox > "$RUNNER_TEMP/rust-liquid-openbox.log" 2>&1 &
            exec /usr/bin/python3 packaging/rust-liquid/long-ui-proof.py \
              --app "$PROOF_APP" --app-data "$PROOF_APP_DATA" \
              --sources "$GITHUB_WORKSPACE/tests/fixtures/rust_liquid_long_sources.json" \
              --diagnostics "$GITHUB_WORKSPACE/ui-proof-diagnostics" --timeout 3600
          '
      - name: Exercise Windows packaged long diarization
        if: runner.os == 'Windows'
        timeout-minutes: 80
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python packaging/rust-liquid/long-ui-proof.py `
            --app "$env:PROOF_APP" --app-data "$env:PROOF_APP_DATA" `
            --sources "$env:GITHUB_WORKSPACE/tests/fixtures/rust_liquid_long_sources.json" `
            --diagnostics "$env:GITHUB_WORKSPACE/ui-proof-diagnostics" --timeout 3600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise both new models through the installed Linux UI
        if: runner.os == 'Linux'
        timeout-minutes: 100
        shell: bash
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          /usr/bin/python3 -c 'import os,pathlib,shutil; p=pathlib.Path(os.environ["PROOF_APP_DATA"]); m=p/"data/ru.gigaam.gui.rustliquid/models"; assert all(not (m/x).exists() for x in ("v4_rnnt","multilingual_v2_rnnt")), "Model cache is not fresh"; assert shutil.disk_usage(p).free >= 12_000_000_000, "Insufficient disk for clean model downloads"'
          for model in v4_rnnt multilingual_v2_rnnt; do
            export PROOF_MODEL="$model"
            dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' sh -c '
              openbox > "$RUNNER_TEMP/rust-liquid-openbox.log" 2>&1 &
              exec /usr/bin/python3 packaging/rust-liquid/ui-proof.py \
                --app "$PROOF_APP" --app-data "$PROOF_APP_DATA" --model "$PROOF_MODEL" \
                --fixture "$GITHUB_WORKSPACE/candidate-source/tests/fixtures/liquid_smoke.wav" \
                --diagnostics "$GITHUB_WORKSPACE/ui-proof-diagnostics/$PROOF_MODEL" --timeout 2400
            '
          done
      - name: Exercise both new models through the installed Windows UI
        if: runner.os == 'Windows'
        timeout-minutes: 100
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python -c 'import os,pathlib,shutil; p=pathlib.Path(os.environ["PROOF_APP_DATA"]); m=p/"roaming/ru.gigaam.gui.rustliquid/models"; assert all(not (m/x).exists() for x in ("v4_rnnt","multilingual_v2_rnnt")), "Model cache is not fresh"; assert shutil.disk_usage(p).free >= 12_000_000_000, "Insufficient disk for clean model downloads"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($model in @('v4_rnnt', 'multilingual_v2_rnnt')) {
            python packaging/rust-liquid/ui-proof.py `
              --app "$env:PROOF_APP" --app-data "$env:PROOF_APP_DATA" --model "$model" `
              --fixture "$env:GITHUB_WORKSPACE/candidate-source/tests/fixtures/liquid_smoke.wav" `
              --diagnostics "$env:GITHUB_WORKSPACE/ui-proof-diagnostics/$model" --timeout 2400
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Prepare pinned Community-1 bundle and attributed short fixture
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import importlib.util
          import json
          import os
          import tempfile
          import urllib.parse
          import urllib.request
          import wave
          import zlib
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          spec = importlib.util.spec_from_file_location(
              "rust_liquid_long_ui_proof", workspace / "packaging/rust-liquid/long-ui-proof.py"
          )
          if spec is None or spec.loader is None:
              raise ImportError("Cannot load the long UI proof fixture helpers")
          proof = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(proof)
          root = Path(tempfile.mkdtemp(prefix="rust-liquid-community-", dir=os.environ["RUNNER_TEMP"]))
          bundle = root / "bundle"
          (bundle / "tract").mkdir(parents=True)

          class HttpsOnlyRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  if urllib.parse.urlsplit(newurl).scheme != "https":
                      raise ValueError("Community-1 asset redirect is not HTTPS")
                  return super().redirect_request(request, fp, code, msg, headers, newurl)

          opener = urllib.request.build_opener(HttpsOnlyRedirect())
          base = "https://github.com/dubr1k/GigaAMGUI/releases/download/community-1-fp32-v1/"
          assets = proof.UI.COMMUNITY_ASSETS
          for asset, relative, expected_size, expected_hash in assets:
              count = 0
              digest = hashlib.sha256()
              with opener.open(base + asset, timeout=60) as response, (bundle / relative).open("xb") as output:
                  while True:
                      block = response.read(min(1024 * 1024, expected_size - count + 1))
                      if not block:
                          break
                      count += len(block)
                      if count > expected_size:
                          raise ValueError(f"Community-1 asset exceeds expected size: {asset}")
                      digest.update(block)
                      output.write(block)
              if count != expected_size or digest.hexdigest() != expected_hash:
                  raise ValueError(f"Community-1 asset size or SHA-256 mismatch: {asset}")
              print(f"Verified Community-1 asset {asset}: {count} bytes, SHA-256 {digest.hexdigest()}")

          # This attributed crop is a functional smoke fixture, not a quality benchmark.
          source = json.loads((workspace / "tests/fixtures/rust_liquid_community_smoke.json").read_text(encoding="utf-8"))
          samples = zlib.decompress(base64.b64decode(source["pcm_zlib_base64"], validate=True))
          if (len(samples) != 15 * 16000 * 2 or
              hashlib.sha256(samples).hexdigest() != "d601d90b332f042550f1682214c164c8ea161bb153e01f0ca0af11bc6fce9ff1"):
              raise ValueError("Community-1 smoke fixture integrity check failed")
          fixture = root / "community-two-speakers.wav"
          with wave.open(str(fixture), "wb") as output:
              output.setnchannels(1)
              output.setsampwidth(2)
              output.setframerate(16000)
              output.writeframes(samples)

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"COMMUNITY_PROOF_BUNDLE={bundle}\n")
              env.write(f"COMMUNITY_PROOF_FIXTURE={fixture}\n")
          PY
      - name: Exercise Community-1 through the installed Linux UI
        if: runner.os == 'Linux'
        timeout-minutes: 35
        shell: bash
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' sh -c '
            openbox > "$RUNNER_TEMP/rust-liquid-openbox.log" 2>&1 &
            exec /usr/bin/python3 packaging/rust-liquid/ui-proof.py \
              --app "$PROOF_APP" --app-data "$PROOF_APP_DATA" --model multilingual_ctc \
              --community-bundle "$COMMUNITY_PROOF_BUNDLE" --fixture "$COMMUNITY_PROOF_FIXTURE" \
              --diagnostics "$GITHUB_WORKSPACE/ui-proof-diagnostics/community-bundle" --timeout 1800
          '
      - name: Exercise Community-1 through the installed Windows UI
        if: runner.os == 'Windows'
        timeout-minutes: 35
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python packaging/rust-liquid/ui-proof.py `
            --app "$env:PROOF_APP" --app-data "$env:PROOF_APP_DATA" --model multilingual_ctc `
            --community-bundle "$env:COMMUNITY_PROOF_BUNDLE" --fixture "$env:COMMUNITY_PROOF_FIXTURE" `
            --diagnostics "$env:GITHUB_WORKSPACE/ui-proof-diagnostics/community-bundle" --timeout 1800
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove Windows proof junctions
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $links = @(
            @{ Path = $env:PROOF_ROAMING_LINK; Target = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'rust-liquid-long-app-data/roaming/ru.gigaam.gui.rustliquid')) },
            @{ Path = $env:PROOF_LOCAL_LINK; Target = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'rust-liquid-long-app-data/local/ru.gigaam.gui.rustliquid')) }
          )
          foreach ($link in $links) {
            if (!$link.Path) { continue }
            $item = Get-Item -LiteralPath $link.Path -Force
            if ($item.LinkType -ne 'Junction' -or $item.Target -ne $link.Target) {
              throw "Refusing to remove changed proof junction: $($link.Path)"
            }
            $item.Delete()
          }
      - name: Upload diagnostics if UI proof failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-liquid-ui-proof-${{ matrix.platform }}-diagnostics
          path: ui-proof-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
      - name: Describe the evidence
        shell: bash
        run: |
          echo 'The packaged application selected the repository WAV and a fresh output directory through native dialogs, ran GigaAM and saved a nonempty transcript matching the visible result.' >> "$GITHUB_STEP_SUMMARY"
          echo 'An existing incomplete Community-1 bundle was rejected without output and its proof-owned file was verified unchanged.' >> "$GITHUB_STEP_SUMMARY"
          echo 'From a separate empty model root the installed app automatically downloaded all four Community-1 assets; sizes and SHA-256 hashes were checked independently, and ASR preparation was cancelled before inference.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A second UI run prepared real multilingual and speaker models. A long UI run cancelled and cleaned real scratch, then checked a >30-minute synthetic-silence fixture, returning speakers, ambiguous/overlap labels and absolute TXT/JSON/SRT output.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Both new models were downloaded to initially empty model directories and transcribed the short fixture through the packaged UI. This does not prove streaming or long-recording quality.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A separate Community-1 UI run used size- and SHA-256-verified public FP32 files and attributed LibriSpeech clips from three separated speakers; it required two distinct numbered labels, not diarization accuracy or the app download flow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The external Python controller is not an app backend. The long sample is short attributed read-speech clips with a long silent gap, not a quality benchmark, continuous-hour performance proof, GPU or live-audio coverage.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record the successful installed-UI attestation
        if: ${{ success() }}
        uses: actions/github-script@v8
        env:
          PLATFORM: ${{ matrix.platform }}
          CANDIDATE_RUN_ID: ${{ steps.source.outputs.run_id }}
          CANDIDATE_SHA: ${{ steps.source.outputs.sha }}
          ASSET_NAME: ${{ matrix.asset }}
          ASSET_SHA256: ${{ steps.package_hash.outputs.sha256 }}
        with:
          script: |
            const fs = require('fs').promises;
            const path = require('path');
            const {PLATFORM: platform, CANDIDATE_RUN_ID: runId, CANDIDATE_SHA: sha,
              ASSET_NAME: assetName, ASSET_SHA256: assetSha256} = process.env;
            if (!['linux-x64', 'windows-x64'].includes(platform) ||
                !/^[1-9][0-9]*$/.test(runId || '') || !Number.isSafeInteger(Number(runId)) ||
                !/^[0-9a-f]{40}$/.test(sha || '') ||
                !assetName || path.basename(assetName) !== assetName ||
                !/^[0-9a-f]{64}$/.test(assetSha256 || '')) {
              throw new Error('Invalid candidate attestation metadata');
            }
            const directory = path.join(process.env.RUNNER_TEMP, 'rust-liquid-ui-attestation');
            await fs.mkdir(directory);
            const attestation = {
              version: 1,
              platform,
              candidate_run_id: Number(runId),
              candidate_sha: sha,
              asset_name: assetName,
              asset_sha256: assetSha256,
            };
            await fs.writeFile(path.join(directory, `${platform}.json`),
              `${JSON.stringify(attestation)}\n`, {flag: 'wx', mode: 0o600});
      - name: Upload the successful installed-UI attestation
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-liquid-ui-attestation-${{ matrix.platform }}
          path: ${{ runner.temp }}/rust-liquid-ui-attestation/${{ matrix.platform }}.json
          if-no-files-found: error
