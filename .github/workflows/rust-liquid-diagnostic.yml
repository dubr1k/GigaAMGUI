name: Temporary Rust Liquid Linux diagnostic
on:
  push:
    branches: [feat/rust-liquid-windows-linux]
    paths: [.github/workflows/rust-liquid-diagnostic.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect previous diagnostic bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libpulse0 gdb
          cd "$RUNNER_TEMP"
          gh run download 45821335226 --repo dubr1k/GigaAMGUI --name rust-liquid-linux-diagnostic
          image=(./*.AppImage)
          chmod +x "${image[0]}"
          "${image[0]}" --appimage-extract >/dev/null
          root="$PWD/squashfs-root"
          binary="$root/usr/bin/gigaam-desktop"
          file "$binary"
          /lib64/ld-linux-x86-64.so.2 --verify "$binary" || echo "loader verify failed: $?"
          env LD_LIBRARY_PATH="$root/usr/lib" ldd "$binary" || echo "ldd failed: $?"
          env LD_LIBRARY_PATH="$root/usr/lib" /lib64/ld-linux-x86-64.so.2 --list "$binary" || echo "loader list failed: $?"
          gdb --batch -ex "set environment LD_LIBRARY_PATH=$root/usr/lib" -ex run -ex bt --args /lib64/ld-linux-x86-64.so.2 --list "$binary" || true
          mv "$root/usr/lib/libpulse.so.0" "$RUNNER_TEMP/bundled-libpulse.so.0"
          for f in "$root"/usr/lib/libpulsecommon-*.so; do [ ! -e "$f" ] || mv "$f" "$RUNNER_TEMP/"; done
          env LD_LIBRARY_PATH="$root/usr/lib" /lib64/ld-linux-x86-64.so.2 --list "$binary" || echo "host pulse loader list failed: $?"
