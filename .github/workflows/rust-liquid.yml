name: Rust Liquid candidate builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "packaging/rust-liquid/**"
      - ".github/workflows/rust-liquid.yml"
  push:
    branches:
      - main
      - feat/rust-liquid-windows-linux
    paths:
      - "desktop/**"
      - "packaging/rust-liquid/**"
      - ".github/workflows/rust-liquid.yml"

permissions:
  contents: read

jobs:
  ffmpeg:
    name: Build and compare pinned FFmpeg binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build twice from signed source in the pinned toolchain
        run: bash packaging/rust-liquid/build-ffmpeg.sh
      - name: Generate short codec fixtures with the runner's FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bash packaging/rust-liquid/make-ffmpeg-fixtures.sh "$RUNNER_TEMP/ffmpeg-fixtures"
      - uses: actions/upload-artifact@v7
        with:
          name: rust-liquid-ffmpeg-linux-x64
          path: packaging/rust-liquid/generated/ffmpeg-linux-x64/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: rust-liquid-ffmpeg-windows-x64
          path: packaging/rust-liquid/generated/ffmpeg-windows-x64/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: rust-liquid-ffmpeg-fixtures
          path: ${{ runner.temp }}/ffmpeg-fixtures/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Rust Liquid ${{ matrix.platform }} candidate
    needs: ffmpeg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            config: linux
            asset: GigaAMGUI-Rust-Liquid-linux-x64.AppImage
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            bundle: nsis
            config: windows
            asset: GigaAMGUI-Rust-Liquid-windows-x64-setup.exe
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Pin published model metadata for the candidate
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/rust-liquid-model-metadata"
          mkdir -p "$directory"
          base=https://github.com/dubr1k/GigaAMGUI/releases/download/rust-models-v1
          for model in v4_rnnt multilingual_v2_rnnt; do
            curl --fail --location --silent --show-error --max-filesize 2000000 \
              "$base/$model-metadata.json" -o "$directory/$model.json"
          done
          echo "929f39721e93a2f61db16c2da2c4c3e4a0a019b9581734e4deb43f52b0979322  $directory/v4_rnnt.json" | sha256sum -c -
          echo "ff8d7d1335258ce33bda406a90b27618481db74421d89fdd794a712c55b33ad3  $directory/multilingual_v2_rnnt.json" | sha256sum -c -
          if [ "$RUNNER_OS" = Windows ]; then directory="$(cygpath -m "$directory")"; fi
          echo "GIGAAM_V4_ASSETS=$directory/v4_rnnt.json" >> "$GITHUB_ENV"
          echo "GIGAAM_MULTILINGUAL_V2_ASSETS=$directory/multilingual_v2_rnnt.json" >> "$GITHUB_ENV"
          echo 'GIGAAM_REQUIRE_RUST_MODELS=1' >> "$GITHUB_ENV"
      - name: Download the matching FFmpeg build and source
        uses: actions/download-artifact@v6
        with:
          name: rust-liquid-ffmpeg-${{ matrix.platform }}
          path: packaging/rust-liquid/generated/ffmpeg
      - name: Download codec fixtures
        uses: actions/download-artifact@v6
        with:
          name: rust-liquid-ffmpeg-fixtures
          path: packaging/rust-liquid/generated/ffmpeg-fixtures
      - name: Check FFmpeg and decode the advertised codec fixtures
        run: |
          set -euo pipefail
          media=../packaging/rust-liquid/generated/ffmpeg
          if [ "$RUNNER_OS" = Windows ]; then executable=ffmpeg.exe; else executable=ffmpeg; fi
          chmod +x "$media/$executable"
          (cd "$media" && sha256sum -c SHA256SUMS)
          python ../packaging/rust-liquid/verify-ffmpeg.py "$media/$executable" ../packaging/rust-liquid/generated/ffmpeg-fixtures
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build and multimedia dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file wget patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev libasound2-dev libpulse-dev libegl1 \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-pulseaudio
      - name: Prepare verified linuxdeploy with host PulseAudio exclusions
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/tauri"
          tool="$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage"
          curl -fL --retry 3 https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage -o "$tool"
          echo "36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62  $tool" | sha256sum -c -
          chmod +x "$tool"
          echo 'LINUXDEPLOY_EXCLUDED_LIBRARIES=libpulse.so.0;libpulsecommon-*.so' >> "$GITHUB_ENV"
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: node --check ui/app.js
      - name: Generate Liquid icons outside the Tauri source directory
        run: npx --no-install tauri icon ../assets/icon-liquid.png --output ../packaging/rust-liquid/generated/icons
      - name: Check inference dependency and supported linking mode
        run: |
          cargo tree --locked --manifest-path src-tauri/Cargo.toml --target "$TARGET" -e features > "$RUNNER_TEMP/rust-liquid-features.txt"
          grep -q 'gigastt-core v' "$RUNNER_TEMP/rust-liquid-features.txt"
          if grep -q 'ort feature "load-dynamic"' "$RUNNER_TEMP/rust-liquid-features.txt"; then
            echo 'Dynamic ONNX Runtime needs a separately verified packaging and loader configuration.' >&2
            exit 1
          fi
      - name: Run locked Rust tests
        run: |
          export TAURI_CONFIG="$(cat ../packaging/rust-liquid/tauri.conf.json)"
          if [ "$RUNNER_OS" = Windows ]; then
            # Cargo 1.100 nests OUT_DIR deeper, so ort-sys 2.0.0-rc.13
            # places DLLs in profile/build and expects these directories.
            for profile in debug release; do
              mkdir -p "src-tauri/target/$TARGET/$profile/build/"{examples,deps}
            done
            # If symlinks are unavailable, ort-sys copies only to its DLL base.
            export PATH="$PWD/src-tauri/target/$TARGET/debug/build:$PWD/src-tauri/target/$TARGET/debug:$PATH"
          else
            export PATH="$GITHUB_WORKSPACE/desktop/src-tauri/target/$TARGET/debug:$PATH"
          fi
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target "$TARGET"
      - name: Run real CPU inference on the audio fixture
        run: |
          export TAURI_CONFIG="$(cat ../packaging/rust-liquid/tauri.conf.json)"
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="$PWD/src-tauri/target/$TARGET/debug/build:$PWD/src-tauri/target/$TARGET/debug:$PATH"
          fi
          cargo run --locked --manifest-path src-tauri/Cargo.toml --target "$TARGET" \
            --example native_inference_smoke -- "$RUNNER_TEMP/gigaam-smoke-model" ../tests/fixtures/liquid_smoke.wav
      - name: Compile the application without bundling
        run: >-
          npm run build -- --no-bundle --target "$TARGET"
          --config ../packaging/rust-liquid/tauri.conf.json -- --locked
      - name: Stage Linux C++ and audio runtimes
        if: runner.os == 'Linux'
        run: |
          mkdir -p ../packaging/rust-liquid/generated/linux
          cp -L /usr/lib/x86_64-linux-gnu/libstdc++.so.6 ../packaging/rust-liquid/generated/linux/libstdc++.so.6
          cp -L /usr/lib/x86_64-linux-gnu/libasound.so.2 ../packaging/rust-liquid/generated/linux/libasound.so.2
      - name: Stage Windows ONNX and VC runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE "desktop/src-tauri/target/$env:TARGET/release"
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'packaging/rust-liquid/generated/windows'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $directML = Join-Path $release 'build/DirectML.dll'
          if (!(Test-Path -PathType Leaf $directML)) { $directML = Join-Path $release 'DirectML.dll' }
          if (!(Test-Path -PathType Leaf $directML)) { throw 'ort did not place DirectML.dll in the release output' }
          Copy-Item $directML $runtime

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual C++ tools not found' }
          $redist = Get-ChildItem (Join-Path $vs 'VC/Redist/MSVC') -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$redist) { throw 'Visual C++ redistributable not found' }
          $crt = Get-ChildItem (Join-Path $redist.FullName 'x64/Microsoft.VC*.CRT') -Directory | Select-Object -First 1
          if (!$crt) { throw 'x64 Visual C++ CRT redistributable not found' }
          Copy-Item (Join-Path $crt.FullName '*.dll') $runtime
          foreach ($name in @('vcruntime140.dll', 'msvcp140.dll')) {
            if (!(Test-Path -PathType Leaf (Join-Path $runtime $name))) { throw "Missing CRT DLL: $name" }
          }
      - name: Package the compiled application
        run: >-
          npx --no-install tauri bundle --target "$TARGET" --bundles "${{ matrix.bundle }}"
          --config ../packaging/rust-liquid/tauri.conf.json
          --config ../packaging/rust-liquid/tauri.${{ matrix.config }}.conf.json
      - name: Restore verified FFmpeg after Linux bundling
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          shopt -s nullglob
          product_name="$(node -p 'require("../packaging/rust-liquid/tauri.conf.json").productName')"
          bundle_dir="$PWD/src-tauri/target/$TARGET/release/bundle/appimage"
          appdir="$bundle_dir/$product_name.AppDir"
          images=("$bundle_dir"/*.AppImage)
          test "${#images[@]}" -eq 1
          test -d "$appdir"
          media="$appdir/usr/lib/$product_name/ffmpeg"
          test -f "$media/ffmpeg"
          cp ../packaging/rust-liquid/generated/ffmpeg/ffmpeg "$media/ffmpeg"
          chmod +x "$media/ffmpeg"
          (cd "$media" && sha256sum -c SHA256SUMS)
          plugin="$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"
          test -x "$plugin"
          OUTPUT="$bundle_dir/repacked.AppImage" ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            "$plugin" --appdir "$appdir"
          test -s "$bundle_dir/repacked.AppImage"
          mv "$bundle_dir/repacked.AppImage" "${images[0]}"
      - name: Inspect the Linux AppImage
        if: runner.os == 'Linux'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euxo pipefail
          shopt -s nullglob
          images=(src-tauri/target/"$TARGET"/release/bundle/appimage/*.AppImage)
          if [ "${#images[@]}" -ne 1 ]; then echo 'Expected exactly one AppImage' >&2; exit 1; fi
          image="$PWD/${images[0]}"
          chmod +x "$image"
          extracted="$(mktemp -d)"
          (cd "$extracted" && "$image" --appimage-extract > /dev/null)
          root="$extracted/squashfs-root"
          binary="$root/usr/bin/gigaam-desktop"
          test -x "$binary"
          # Tauri's Linux resource_dir uses the compiled productName, not the Cargo binary name.
          product_name="$(node -p 'require("../packaging/rust-liquid/tauri.conf.json").productName')"
          media="$root/usr/lib/$product_name/ffmpeg"
          test -x "$media/ffmpeg"
          cmp "$media/ffmpeg" ../packaging/rust-liquid/generated/ffmpeg/ffmpeg
          cmp "$media/SHA256SUMS" ../packaging/rust-liquid/generated/ffmpeg/SHA256SUMS
          (cd "$media" && sha256sum -c SHA256SUMS)
          test -s "$media/source/ffmpeg-9.0.2.tar.xz"
          test -s "$media/source/COPYING.LGPLv2.1"
          test -s "$media/source/dependency-copyrights.tar.xz"
          diff -r "$media/source" ../packaging/rust-liquid/generated/ffmpeg/source
          LC_ALL=C readelf -h "$binary" | grep -q 'Advanced Micro Devices X86-64'
          test -s "$root/usr/lib/libstdc++.so.6"
          # linuxdeploy may strip or patch the library; compare its ELF build ID.
          staged_id="$(readelf -n ../packaging/rust-liquid/generated/linux/libstdc++.so.6 | awk '/Build ID:/ {print $3; exit}')"
          bundled_id="$(readelf -n "$root/usr/lib/libstdc++.so.6" | awk '/Build ID:/ {print $3; exit}')"
          test -n "$staged_id" && test "$staged_id" = "$bundled_id"
          test -n "$(find "$root/usr" -name 'libwebkit2gtk-4.1.so*' -print -quit)"
          if find "$root/usr" \( -name 'libpulse.so.0' -o -name 'libpulsecommon-*.so' \) -print -quit | grep -q .; then
            echo 'Bundled PulseAudio runtime conflicts with host; expected system libraries' >&2; exit 1
          fi
          if find "$root" -type f \( -iname 'python' -o -iname 'python[0-9]*' -o -iname 'libpython*.so*' \) | grep -q .; then
            echo 'Unexpected Python runtime in AppImage' >&2; exit 1
          fi
          readelf -d "$binary" > "$RUNNER_TEMP/rust-liquid-needed.txt"
          grep -Fq 'Shared library: [libstdc++.so.6]' "$RUNNER_TEMP/rust-liquid-needed.txt"
          if grep -Eiq 'Shared library: \[(libonnxruntime|libpython)' "$RUNNER_TEMP/rust-liquid-needed.txt"; then
            echo 'Unexpected dynamically linked ONNX Runtime or Python' >&2; exit 1
          fi
          # glibc, GCC support and PulseAudio are supplied by the host; other
          # direct dependencies of the executable must be in the image.
          while IFS= read -r library; do
            case "$library" in
              libc.so.6|libm.so.6|libpthread.so.0|libdl.so.2|librt.so.1|libgcc_s.so.1|libpulse.so.0|ld-linux-x86-64.so.2) continue ;;
            esac
            if [ -z "$(find "$root/usr" -name "$library" -print -quit)" ]; then
              echo "Missing direct dependency in AppImage: $library" >&2; exit 1
            fi
          done < <(awk -F'[][]' '/\(NEEDED\)/ { print $2 }' "$RUNNER_TEMP/rust-liquid-needed.txt")
          LD_LIBRARY_PATH="$root/usr/lib" ldd "$binary" | tee "$RUNNER_TEMP/rust-liquid-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/rust-liquid-ldd.txt"; then exit 1; fi
          mkdir -p ../artifacts
          cp "$image" "../artifacts/$ASSET"
      - name: Upload failed Linux bundle for diagnosis
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rust-liquid-linux-diagnostic
          path: desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
          retention-days: 1
      - name: Inspect the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE "desktop/src-tauri/target/$env:TARGET/release"
          $installers = @(Get-ChildItem (Join-Path $release 'bundle/nsis/*.exe') -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $extracted = Join-Path $env:RUNNER_TEMP 'rust-liquid-installer'
          & 7z x -y "-o$extracted" $installers[0].FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract installer' }
          $apps = @(Get-ChildItem $extracted -Recurse -File -Filter 'gigaam-desktop.exe')
          if ($apps.Count -ne 1) { throw 'Installer must contain exactly one desktop executable' }
          $app = $apps[0]
          foreach ($name in @('DirectML.dll', 'vcruntime140.dll', 'msvcp140.dll')) {
            if (!(Test-Path -PathType Leaf (Join-Path $app.DirectoryName $name))) { throw "Missing adjacent runtime DLL: $name" }
          }
          $staged = Join-Path $env:GITHUB_WORKSPACE 'packaging/rust-liquid/generated/windows/DirectML.dll'
          if ((Get-FileHash $staged).Hash -ne (Get-FileHash (Join-Path $app.DirectoryName 'DirectML.dll')).Hash) {
            throw 'The installer contains a different DirectML.dll'
          }
          if (!(Get-ChildItem $extracted -Recurse -File -Filter '*WebView2RuntimeInstaller*.exe')) {
            throw 'The offline WebView2 installer was not found inside NSIS'
          }
          $python = Get-ChildItem $extracted -Recurse -File | Where-Object {
            $_.Name -match '^(pythonw?(\d+)?\.(exe|dll)|pyvenv\.cfg)$'
          }
          if ($python) { throw 'Unexpected Python runtime in installer' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual C++ tools not found' }
          $dumpbin = Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC') -Recurse -File -Filter dumpbin.exe |
            Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dumpbin) { throw 'x64 dumpbin not found' }
          $headers = & $dumpbin.FullName /headers $app.FullName | Out-String
          if ($LASTEXITCODE -ne 0 -or $headers -notmatch '(?i)8664 machine') { throw 'Application is not an x64 PE executable' }
          $imports = & $dumpbin.FullName /dependents $app.FullName | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect executable imports' }
          if ($imports -notmatch '(?i)\bDirectML\.dll\b') { throw 'Expected statically linked ONNX Runtime with DirectML' }
          if ($imports -match '(?i)\b(onnxruntime|python\d*)\.dll\b') { throw 'Unexpected ONNX Runtime or Python DLL dependency' }
          $media = Join-Path $app.DirectoryName 'ffmpeg'
          $ffmpeg = Join-Path $media 'ffmpeg.exe'
          $stagedFfmpeg = Join-Path $env:GITHUB_WORKSPACE 'packaging/rust-liquid/generated/ffmpeg'
          foreach ($name in @('ffmpeg.exe', 'SHA256SUMS', 'source/ffmpeg-9.0.2.tar.xz', 'source/COPYING.LGPLv2.1', 'source/COPYING.MinGW-w64-runtime.txt', 'source/dependency-copyrights.tar.xz')) {
            if (!(Test-Path -PathType Leaf (Join-Path $media $name))) { throw "Missing FFmpeg resource: $name" }
          }
          foreach ($name in @('ffmpeg.exe', 'SHA256SUMS')) {
            if ((Get-FileHash (Join-Path $media $name)).Hash -ne (Get-FileHash (Join-Path $stagedFfmpeg $name)).Hash) {
              throw "FFmpeg resource changed during bundling: $name"
            }
          }
          Get-ChildItem (Join-Path $stagedFfmpeg 'source') -Recurse -File | ForEach-Object {
            $relative = $_.FullName.Substring($stagedFfmpeg.Length + 1)
            $bundled = Join-Path $media $relative
            if (!(Test-Path -PathType Leaf $bundled) -or (Get-FileHash $bundled).Hash -ne (Get-FileHash $_.FullName).Hash) {
              throw "FFmpeg source or notice changed during bundling: $relative"
            }
          }
          $ffHeaders = & $dumpbin.FullName /headers $ffmpeg | Out-String
          if ($LASTEXITCODE -ne 0 -or $ffHeaders -notmatch '(?i)8664 machine') { throw 'FFmpeg is not an x64 PE executable' }
          $ffImports = & $dumpbin.FullName /dependents $ffmpeg | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect FFmpeg imports' }
          $systemDlls = @('advapi32.dll', 'bcrypt.dll', 'gdi32.dll', 'kernel32.dll', 'msvcrt.dll', 'ntdll.dll', 'ole32.dll', 'psapi.dll', 'shell32.dll', 'user32.dll', 'ws2_32.dll')
          $dependencies = @([regex]::Matches($ffImports, '(?im)^\s+([a-z0-9_.-]+\.dll)\s*$') | ForEach-Object { $_.Groups[1].Value.ToLowerInvariant() })
          if (!$dependencies.Count) { throw 'No FFmpeg imports were found' }
          foreach ($dependency in $dependencies) {
            if ($dependency -notin $systemDlls -or !(Test-Path -PathType Leaf (Join-Path "$env:windir/System32" $dependency))) {
              throw "Unexpected or unavailable Windows FFmpeg dependency: $dependency"
            }
          }
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Copy-Item $installers[0].FullName (Join-Path $output $env:ASSET)
      - name: Upload candidate, not a release asset
        uses: actions/upload-artifact@v7
        with:
          name: rust-liquid-${{ matrix.platform }}-candidate
          path: artifacts/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0
      - name: Describe verification limits
        run: |
          echo 'Candidate only: inspect on a clean target system and exercise real inference before release.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Models are downloaded separately; ort prebuilt x64 binaries require x86-64-v3.' >> "$GITHUB_STEP_SUMMARY"
