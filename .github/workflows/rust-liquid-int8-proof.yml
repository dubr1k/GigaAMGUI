name: Rust Liquid Community-1 INT8 compatibility proof

# This isolated AMI-calibrated compatibility proof is not a release gate.
# A branch push starts it without requiring workflow_dispatch on the default branch.
on:
  push:
    branches: [feat/rust-liquid-windows-linux]
    paths:
      - .github/workflows/rust-liquid-int8-proof.yml
      - packaging/rust-liquid/int8_ci_bundle.py
      - packaging/rust-liquid/ami_int8_ci_bundle.py
      - packaging/rust-liquid/community-export/**
      - packaging/rust-liquid/ui-proof.py

permissions:
  actions: read
  contents: read

jobs:
  producer:
    name: Produce a proof-only INT8 bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.bundle.outputs.archive_sha256 }}
      embedding_sha256: ${{ steps.bundle.outputs.embedding_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the pinned conversion dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0' 'torchaudio==2.8.0'
          python -m pip install 'soundfile==0.13.1' 'numpy==2.2.6' 'onnx==1.19.1' 'onnxruntime==1.23.2'
      - name: Download and verify the four pinned public FP32 assets
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import importlib.util
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          spec = importlib.util.spec_from_file_location('ui_proof', workspace / 'packaging/rust-liquid/ui-proof.py')
          if spec is None or spec.loader is None:
              raise ImportError('Cannot load the existing pinned Community-1 asset list')
          ui = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ui)
          expected = (
              ('export.json', 'export.json', 2882, '99cf740b8093e4a4c7491fcfdd389887941a470ac651887694384940a2dea7ad'),
              ('plda.json', 'plda.json', 983502, '8cadc0a017fce6e9fc9f1802b40b7a2a367889ec6f6e01b31f7b5b5adeead17a'),
              ('segmentation.onnx', 'tract/segmentation.onnx', 5984909, '8e8ddc4b066e14bf6fdc0e97a93206326de6346f7b99df9f06a5f9903d3ae2b5'),
              ('embedding.onnx', 'tract/embedding.onnx', 26553403, '26ce0859c0afd8084e60b3ccd9d9f0a1999785ac18b13e1abf51cca50caea5af'),
          )
          if ui.COMMUNITY_ASSETS != expected:
              raise ValueError('The existing asset pins differ from this proof candidate')
          source = Path(os.environ['RUNNER_TEMP']) / 'int8-proof-source'
          (source / 'tract').mkdir(parents=True, exist_ok=False)

          class HttpsOnlyRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  if urllib.parse.urlsplit(newurl).scheme != 'https':
                      raise ValueError('Community-1 asset redirect is not HTTPS')
                  return super().redirect_request(request, fp, code, msg, headers, newurl)

          opener = urllib.request.build_opener(HttpsOnlyRedirect())
          base = 'https://github.com/dubr1k/GigaAMGUI/releases/download/community-1-fp32-v1/'
          for asset, relative, expected_size, expected_hash in expected:
              count = 0
              digest = hashlib.sha256()
              with opener.open(base + asset, timeout=60) as response, (source / relative).open('xb') as output:
                  while True:
                      block = response.read(min(1024 * 1024, expected_size - count + 1))
                      if not block:
                          break
                      count += len(block)
                      if count > expected_size:
                          raise ValueError(f'Community-1 asset exceeds its pinned size: {asset}')
                      digest.update(block)
                      output.write(block)
              if count != expected_size or digest.hexdigest() != expected_hash:
                  raise ValueError(f'Community-1 asset size or SHA-256 mismatch: {asset}')
              print(f'Verified {asset}: {count} bytes, SHA-256 {digest.hexdigest()}')
          audio = Path(os.environ['RUNNER_TEMP']) / 'ES2004a.Mix-Headset.wav'
          expected_size = 33579394
          digest = hashlib.sha256()
          count = 0
          with opener.open('https://groups.inf.ed.ac.uk/ami/AMICorpusMirror/amicorpus/ES2004a/audio/ES2004a.Mix-Headset.wav', timeout=60) as response, audio.open('xb') as output:
              while True:
                  block = response.read(min(1024 * 1024, expected_size - count + 1))
                  if not block:
                      break
                  count += len(block)
                  if count > expected_size:
                      raise ValueError('AMI audio exceeds its pinned size')
                  digest.update(block)
                  output.write(block)
          if count != expected_size or digest.hexdigest() != '3e2560b19bee6952c7c7ce041b0f1ea8a7ea9468044c4eea79d2a2c67e24ab0f':
              raise ValueError('AMI audio size or SHA-256 mismatch')
          print('Verified pinned AMI calibration audio')
          PY
      - name: Generate and hash the AMI-calibrated bundle
        id: bundle
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/int8-proof-source"
          bundle="$RUNNER_TEMP/int8-proof-bundle"
          artifact="$RUNNER_TEMP/int8-proof-artifact"
          mkdir "$artifact"
          # Real-audio calibration does not by itself establish quality or speed.
          OMP_NUM_THREADS=2 python packaging/rust-liquid/ami_int8_ci_bundle.py --source "$source" --audio "$RUNNER_TEMP/ES2004a.Mix-Headset.wav" --output "$bundle"
          tar -cf "$artifact/community-int8-proof.tar" -C "$bundle" \
            export.json plda.json tract/segmentation.onnx tract/embedding.onnx proof-manifest.json
          archive_sha256="$(sha256sum "$artifact/community-int8-proof.tar" | cut -d ' ' -f1)"
          embedding_sha256="$(sha256sum "$bundle/tract/embedding.onnx" | cut -d ' ' -f1)"
          test "$embedding_sha256" = '572dfb13d9d41dbc494303d410f41a68a9ea9f187675ded137cd7dadcc6c819f' || { echo 'AMI-calibrated graph differs from the evaluated Linux artifact' >&2; exit 1; }
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ && "$embedding_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s\n' "$archive_sha256" > "$artifact/archive.sha256"
          printf '%s\n' "$embedding_sha256" > "$artifact/embedding.sha256"
          printf 'archive_sha256=%s\nembedding_sha256=%s\n' "$archive_sha256" "$embedding_sha256" >> "$GITHUB_OUTPUT"
          printf 'Proof archive SHA-256: `%s`\n\nINT8 embedding graph SHA-256: `%s`\n\nAMI calibration and short UI smoke do not establish diarization quality or speed.\n' \
            "$archive_sha256" "$embedding_sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the proof bundle, not a release asset
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: rust-liquid-int8-proof-bundle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/int8-proof-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  sources:
    name: Resolve same-revision candidate and installed-UI evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      candidate_run_id: ${{ steps.resolve.outputs.candidate_run_id }}
      ui_run_id: ${{ steps.resolve.outputs.ui_run_id }}
      candidate_artifacts: ${{ steps.resolve.outputs.candidate_artifacts }}
      attestation_artifacts: ${{ steps.resolve.outputs.attestation_artifacts }}
    steps:
      - name: Wait for the unique successful first-attempt push runs
        id: resolve
        uses: actions/github-script@v8
        timeout-minutes: 355
        with:
          script: |
            const sha = context.sha;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const repoId = Number(process.env.GITHUB_REPOSITORY_ID);
            const repoName = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            if (context.eventName !== 'push' || context.ref !== `refs/heads/${branch}` ||
                branch !== 'feat/rust-liquid-windows-linux' || !/^[0-9a-f]{40}$/.test(sha) ||
                !Number.isSafeInteger(repoId) || repoId <= 0 || context.payload.repository?.id !== repoId) {
              throw new Error('Unexpected proof push identity');
            }
            const workflows = [
              {key: 'candidate', file: 'rust-liquid.yml', path: '.github/workflows/rust-liquid.yml'},
              {key: 'ui', file: 'rust-liquid-ui-proof.yml', path: '.github/workflows/rust-liquid-ui-proof.yml'},
            ];
            function validateRun(run, workflow, completed) {
              if (!Number.isSafeInteger(run.id) || run.id <= 0 || run.path !== workflow.path ||
                  run.repository?.id !== repoId || run.head_repository?.id !== repoId ||
                  run.repository?.full_name?.toLowerCase() !== repoName ||
                  run.head_repository?.full_name?.toLowerCase() !== repoName ||
                  run.head_branch !== branch || run.head_sha !== sha || run.event !== 'push' ||
                  run.run_attempt !== 1) {
                throw new Error(`Untrusted or rerun ${workflow.key} workflow run`);
              }
              if (run.status === 'completed' && run.conclusion !== 'success') {
                throw new Error(`${workflow.key} workflow first attempt completed with ${run.conclusion}`);
              }
              if (completed && (run.status !== 'completed' || run.conclusion !== 'success')) {
                throw new Error(`${workflow.key} workflow is no longer a successful first attempt`);
              }
            }
            const registrationDeadline = Date.now() + 10 * 60 * 1000;
            const deadline = Date.now() + 350 * 60 * 1000;
            let selected;
            while (Date.now() < deadline) {
              const current = {};
              for (const workflow of workflows) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...context.repo, workflow_id: workflow.file, branch, event: 'push', head_sha: sha, per_page: 100,
                });
                const matches = runs.filter(run =>
                  run.head_sha === sha && run.head_branch === branch && run.event === 'push');
                if (matches.length > 1) throw new Error(`Ambiguous ${workflow.key} push runs for ${sha}`);
                if (!matches.length) {
                  if (Date.now() >= registrationDeadline) {
                    throw new Error(`No ${workflow.key} push run registered for ${sha}`);
                  }
                  continue;
                }
                validateRun(matches[0], workflow, false);
                current[workflow.key] = matches[0];
              }
              if (workflows.every(workflow => current[workflow.key]?.status === 'completed')) {
                selected = current;
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            if (!selected) throw new Error('Timed out waiting for same-SHA candidate and UI proofs');
            for (const workflow of workflows) {
              const {data: run} = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: selected[workflow.key].id,
              });
              validateRun(run, workflow, true);
              selected[workflow.key] = run;
            }

            async function requireJobs(runId, required) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: runId, filter: 'latest', per_page: 100,
              });
              for (const [name, steps] of required) {
                const matches = jobs.filter(job => job.name === name);
                if (matches.length !== 1 || matches[0].status !== 'completed' || matches[0].conclusion !== 'success') {
                  throw new Error(`Required job is missing, ambiguous, or unsuccessful: ${name}`);
                }
                for (const stepName of steps) {
                  const found = (matches[0].steps || []).filter(step => step.name === stepName);
                  if (found.length !== 1 || found[0].status !== 'completed' || found[0].conclusion !== 'success') {
                    throw new Error(`Required step did not succeed in ${name}: ${stepName}`);
                  }
                }
              }
            }
            await requireJobs(selected.candidate.id, [
              ['Build and compare pinned FFmpeg binaries', ['Build twice from signed source in the pinned toolchain']],
              ['Rust Liquid linux-x64 candidate', ['Upload candidate, not a release asset']],
              ['Rust Liquid windows-x64 candidate', ['Upload candidate, not a release asset']],
            ]);
            await requireJobs(selected.ui.id, ['linux-x64', 'windows-x64'].map(platform => {
              const os = platform === 'linux-x64' ? 'Linux' : 'Windows';
              return [`Installed candidate UI (${platform})`, [
                'Validate the source run before downloading executable artifacts',
                'Verify the checked-out proof harness revision',
                'Hash the downloaded candidate package before installation',
                `Verify automatic Community-1 delivery through the installed ${os} UI`,
                `Exercise Community-1 through the installed ${os} UI`,
                'Record the successful installed-UI attestation',
                'Upload the successful installed-UI attestation',
              ]];
            }));

            async function artifactsFor(run, prefix, suffix) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: run.id, per_page: 100,
              });
              const result = {};
              for (const platform of ['linux-x64', 'windows-x64']) {
                const name = `${prefix}${platform}${suffix}`;
                const matches = artifacts.filter(artifact => artifact.name === name);
                if (matches.length !== 1) throw new Error(`Missing or ambiguous artifact ${name}`);
                const {data: artifact} = await github.rest.actions.getArtifact({
                  ...context.repo, artifact_id: matches[0].id,
                });
                const source = artifact.workflow_run;
                if (!Number.isSafeInteger(artifact.id) || artifact.id <= 0 ||
                    artifact.id !== matches[0].id || artifact.name !== name || artifact.expired !== false ||
                    !Number.isSafeInteger(artifact.size_in_bytes) || artifact.size_in_bytes <= 0 ||
                    !/^sha256:[0-9a-f]{64}$/.test(artifact.digest || '') ||
                    source?.id !== run.id || source.repository_id !== repoId ||
                    source.head_repository_id !== repoId || source.head_branch !== branch || source.head_sha !== sha) {
                  throw new Error(`Untrusted artifact metadata: ${name}`);
                }
                result[platform] = {id: artifact.id, digest: artifact.digest};
              }
              return result;
            }
            const candidates = await artifactsFor(selected.candidate, 'rust-liquid-', '-candidate');
            const attestations = await artifactsFor(selected.ui, 'rust-liquid-ui-attestation-', '');
            core.setOutput('candidate_run_id', String(selected.candidate.id));
            core.setOutput('ui_run_id', String(selected.ui.id));
            core.setOutput('candidate_artifacts', JSON.stringify(candidates));
            core.setOutput('attestation_artifacts', JSON.stringify(attestations));
            core.info(`Resolved candidate run ${selected.candidate.id} and UI proof run ${selected.ui.id} for ${sha}`);

  installed-ui:
    name: INT8 installed-app proof (${{ matrix.platform }})
    needs: [producer, sources]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            asset: GigaAMGUI-Rust-Liquid-linux-x64.AppImage
          - os: windows-2022
            platform: windows-x64
            asset: GigaAMGUI-Rust-Liquid-windows-x64-setup.exe
    steps:
      - name: Check out the same-revision UI harness and fixture
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the proof harness revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Revalidate and download the exact candidate and UI attestation archives
        uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          CANDIDATE_RUN_ID: ${{ needs.sources.outputs.candidate_run_id }}
          UI_RUN_ID: ${{ needs.sources.outputs.ui_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ fromJSON(needs.sources.outputs.candidate_artifacts)[matrix.platform].id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ fromJSON(needs.sources.outputs.candidate_artifacts)[matrix.platform].digest }}
          ATTESTATION_ARTIFACT_ID: ${{ fromJSON(needs.sources.outputs.attestation_artifacts)[matrix.platform].id }}
          ATTESTATION_ARTIFACT_DIGEST: ${{ fromJSON(needs.sources.outputs.attestation_artifacts)[matrix.platform].digest }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const {Readable, Transform} = require('stream');
            const {pipeline} = require('stream/promises');
            const sha = context.sha;
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const repoId = Number(process.env.GITHUB_REPOSITORY_ID);
            const repoName = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const platform = process.env.PLATFORM;
            function id(value) {
              if (!/^[1-9][0-9]*$/.test(value || '') || !Number.isSafeInteger(Number(value))) {
                throw new Error('Invalid workflow run or artifact ID');
              }
              return Number(value);
            }
            if (context.eventName !== 'push' || context.ref !== `refs/heads/${branch}` ||
                branch !== 'feat/rust-liquid-windows-linux' || !/^[0-9a-f]{40}$/.test(sha) ||
                !Number.isSafeInteger(repoId) || repoId <= 0 || context.payload.repository?.id !== repoId ||
                !['linux-x64', 'windows-x64'].includes(platform)) {
              throw new Error('Unexpected proof push identity');
            }
            const sources = [
              {
                runId: id(process.env.CANDIDATE_RUN_ID), workflow: '.github/workflows/rust-liquid.yml',
                artifactId: id(process.env.CANDIDATE_ARTIFACT_ID), digest: process.env.CANDIDATE_ARTIFACT_DIGEST,
                name: `rust-liquid-${platform}-candidate`, archive: 'int8-candidate.zip',
              },
              {
                runId: id(process.env.UI_RUN_ID), workflow: '.github/workflows/rust-liquid-ui-proof.yml',
                artifactId: id(process.env.ATTESTATION_ARTIFACT_ID), digest: process.env.ATTESTATION_ARTIFACT_DIGEST,
                name: `rust-liquid-ui-attestation-${platform}`, archive: 'int8-ui-attestation.zip',
              },
            ];
            for (const source of sources) {
              if (!/^sha256:[0-9a-f]{64}$/.test(source.digest || '')) throw new Error('Invalid artifact digest');
              const {data: run} = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: source.runId,
              });
              if (run.id !== source.runId || run.path !== source.workflow ||
                  run.repository?.id !== repoId || run.head_repository?.id !== repoId ||
                  run.repository?.full_name?.toLowerCase() !== repoName ||
                  run.head_repository?.full_name?.toLowerCase() !== repoName ||
                  run.head_branch !== branch || run.head_sha !== sha || run.event !== 'push' ||
                  run.run_attempt !== 1 || run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error(`Source run changed or is untrusted: ${source.workflow}`);
              }
              const {data: artifact} = await github.rest.actions.getArtifact({
                ...context.repo, artifact_id: source.artifactId,
              });
              const origin = artifact.workflow_run;
              if (artifact.id !== source.artifactId || artifact.name !== source.name ||
                  artifact.expired !== false || artifact.digest !== source.digest ||
                  !Number.isSafeInteger(artifact.size_in_bytes) || artifact.size_in_bytes <= 0 ||
                  origin?.id !== source.runId || origin.repository_id !== repoId ||
                  origin.head_repository_id !== repoId || origin.head_branch !== branch || origin.head_sha !== sha) {
                throw new Error(`Source artifact changed or is untrusted: ${source.name}`);
              }
              const endpoint = `${process.env.GITHUB_API_URL}/repos/${context.repo.owner}/${context.repo.repo}/actions/artifacts/${source.artifactId}/zip`;
              const redirect = await fetch(endpoint, {
                headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'},
                redirect: 'manual',
              });
              const location = redirect.headers.get('location');
              if (redirect.status !== 302 || !location) throw new Error(`No download redirect for ${source.name} (HTTP ${redirect.status})`);
              let url;
              try {
                url = new URL(location);
              } catch {
                throw new Error(`Invalid download redirect for ${source.name}`);
              }
              if (url.protocol !== 'https:' || url.username || url.password) {
                throw new Error(`Unsafe download redirect for ${source.name}`);
              }
              let response;
              try {
                response = await fetch(url, {redirect: 'error', signal: AbortSignal.timeout(20 * 60 * 1000)});
              } catch {
                throw new Error(`Download failed for ${source.name}`);
              }
              if (!response.ok || !response.body) throw new Error(`Download failed for ${source.name}`);
              const archive = path.join(process.env.RUNNER_TEMP, source.archive);
              const hash = crypto.createHash('sha256');
              const hashing = new Transform({
                transform(chunk, encoding, callback) {
                  hash.update(chunk);
                  callback(null, chunk);
                },
              });
              try {
                await pipeline(Readable.fromWeb(response.body), hashing, fs.createWriteStream(archive, {flags: 'wx'}));
              } catch {
                throw new Error(`Download stream failed for ${source.name}`);
              }
              if (`sha256:${hash.digest('hex')}` !== source.digest) {
                throw new Error(`Downloaded artifact digest mismatch for ${source.name}`);
              }
              core.info(`Verified ${source.name}: artifact ${source.artifactId}, ${source.digest}`);
            }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify the same-SHA UI attestation and candidate package
        id: package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET: ${{ matrix.asset }}
          CANDIDATE_RUN_ID: ${{ needs.sources.outputs.candidate_run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import zipfile
          from pathlib import Path

          def single_entry(archive, name):
              entries = archive.infolist()
              if len(entries) != 1 or entries[0].filename != name or entries[0].is_dir():
                  raise ValueError(f'Unexpected entries in {name} artifact')
              entry = entries[0]
              kind = stat.S_IFMT(entry.external_attr >> 16)
              if kind not in (0, stat.S_IFREG) or entry.file_size <= 0:
                  raise ValueError(f'Invalid entry type or size for {name}')
              return entry

          temp = Path(os.environ['RUNNER_TEMP'])
          platform = os.environ['PLATFORM']
          asset = os.environ['ASSET']
          with zipfile.ZipFile(temp / 'int8-ui-attestation.zip') as archive:
              entry = single_entry(archive, f'{platform}.json')
              if entry.file_size > 1024 * 1024:
                  raise ValueError('UI attestation is unexpectedly large')
              attestation = json.loads(archive.read(entry))
          fields = {'version', 'platform', 'candidate_run_id', 'candidate_sha', 'asset_name', 'asset_sha256'}
          if (not isinstance(attestation, dict) or set(attestation) != fields or
                  type(attestation['version']) is not int or attestation['version'] != 1 or
                  type(attestation['candidate_run_id']) is not int or
                  attestation['candidate_run_id'] != int(os.environ['CANDIDATE_RUN_ID']) or
                  attestation['candidate_sha'] != os.environ['GITHUB_SHA'] or
                  attestation['platform'] != platform or attestation['asset_name'] != asset or
                  not isinstance(attestation['asset_sha256'], str) or
                  not re.fullmatch(r'[0-9a-f]{64}', attestation['asset_sha256'])):
              raise ValueError('UI attestation does not bind this candidate, revision, platform, and asset')
          directory = Path(os.environ['GITHUB_WORKSPACE']) / 'candidate-package'
          directory.mkdir()
          package = directory / asset
          digest = hashlib.sha256()
          with zipfile.ZipFile(temp / 'int8-candidate.zip') as archive:
              entry = single_entry(archive, asset)
              with archive.open(entry) as source, package.open('xb') as output:
                  while block := source.read(1024 * 1024):
                      digest.update(block)
                      output.write(block)
          actual = digest.hexdigest()
          if actual != attestation['asset_sha256']:
              raise ValueError('Candidate package SHA-256 does not match the same-SHA UI attestation')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'asset_sha256={actual}\n')
          print(f'Verified candidate package SHA-256 {actual} against the same-SHA installed-UI attestation')
          PY
      - name: Download the producer's exact proof artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.producer.outputs.artifact_id }}
          path: ${{ runner.temp }}/int8-proof-download
      - name: Verify archive and graph hashes before preparing the UI fixture
        shell: bash
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.producer.outputs.archive_sha256 }}
          EXPECTED_EMBEDDING_SHA256: ${{ needs.producer.outputs.embedding_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import shutil
          import tarfile
          import wave
          import zlib
          from pathlib import Path, PurePosixPath

          def sha256(path):
              digest = hashlib.sha256()
              with path.open('rb') as source:
                  for block in iter(lambda: source.read(1024 * 1024), b''):
                      digest.update(block)
              return digest.hexdigest()

          temp = Path(os.environ['RUNNER_TEMP'])
          download = temp / 'int8-proof-download'
          archive = download / 'community-int8-proof.tar'
          archive_hash = os.environ['EXPECTED_ARCHIVE_SHA256']
          embedding_hash = os.environ['EXPECTED_EMBEDDING_SHA256']
          if not all(re.fullmatch(r'[0-9a-f]{64}', value or '') for value in (archive_hash, embedding_hash)):
              raise ValueError('Missing or malformed producer hashes')
          if ((download / 'archive.sha256').read_text(encoding='ascii').strip() != archive_hash or
                  (download / 'embedding.sha256').read_text(encoding='ascii').strip() != embedding_hash or
                  sha256(archive) != archive_hash):
              raise ValueError('Proof archive or recorded SHA-256 mismatch')
          # Do not extract until the independently propagated archive hash matches.
          names = {'export.json', 'plda.json', 'tract/segmentation.onnx', 'tract/embedding.onnx', 'proof-manifest.json'}
          bundle = temp / 'int8-proof-verified-bundle'
          bundle.mkdir()
          with tarfile.open(archive, 'r:') as payload:
              members = payload.getmembers()
              if (len(members) != len(names) or {member.name for member in members} != names or
                      any(not member.isfile() or member.size <= 0 for member in members)):
                  raise ValueError('Unexpected files or entry types in the proof archive')
              for member in members:
                  target = bundle.joinpath(*PurePosixPath(member.name).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  stream = payload.extractfile(member)
                  if stream is None:
                      raise ValueError(f'Cannot read archive entry {member.name}')
                  with stream, target.open('xb') as output:
                      shutil.copyfileobj(stream, output)
          if sha256(bundle / 'tract/embedding.onnx') != embedding_hash:
              raise ValueError('Extracted INT8 embedding graph SHA-256 mismatch')

          # Same attributed 15-second smoke crop and PCM pin as the existing UI proof.
          source = json.loads((Path(os.environ['GITHUB_WORKSPACE']) / 'tests/fixtures/rust_liquid_community_smoke.json').read_text(encoding='utf-8'))
          samples = zlib.decompress(base64.b64decode(source['pcm_zlib_base64'], validate=True))
          fixture_hash = 'd601d90b332f042550f1682214c164c8ea161bb153e01f0ca0af11bc6fce9ff1'
          if len(samples) != 15 * 16000 * 2 or hashlib.sha256(samples).hexdigest() != fixture_hash:
              raise ValueError('Community-1 smoke fixture integrity check failed')
          fixture = temp / 'int8-community-two-speakers.wav'
          with wave.open(str(fixture), 'wb') as output:
              output.setnchannels(1)
              output.setsampwidth(2)
              output.setframerate(16000)
              output.writeframes(samples)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f'COMMUNITY_PROOF_BUNDLE={bundle}\nCOMMUNITY_PROOF_FIXTURE={fixture}\n')
          print(f'Verified archive SHA-256 {archive_hash}, embedding SHA-256 {embedding_hash}, fixture PCM SHA-256 {fixture_hash}')
          PY
      - name: Check Windows input desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: python packaging/rust-liquid/ui-proof.py --check-display
      - name: Install Linux GUI and packaged-app runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            webkit2gtk-driver xvfb xauth xdotool x11-utils openbox \
            python3-pyatspi dbus-x11 scrot libpulse0 libegl1 libgles2
      - name: Install Windows native dialog automation
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install 'pywinauto==0.6.9'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri's WebDriver intermediary
        shell: bash
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Extract the Linux AppImage without FUSE
        if: runner.os == 'Linux'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          image="$GITHUB_WORKSPACE/candidate-package/$ASSET"
          test -s "$image"
          chmod +x "$image"
          mkdir "$RUNNER_TEMP/rust-liquid-package"
          (cd "$RUNNER_TEMP/rust-liquid-package" && "$image" --appimage-extract > /dev/null)
          root="$RUNNER_TEMP/rust-liquid-package/squashfs-root"
          test -x "$root/AppRun"
          if find "$root" -type f \( -iname 'python' -o -iname 'python[0-9]*' -o -iname 'libpython*.so*' \) -print -quit | grep -q .; then
            echo 'Unexpected Python runtime in candidate AppImage' >&2; exit 1
          fi
          echo "PROOF_APP=$root/AppRun" >> "$GITHUB_ENV"
      - name: Install the Windows NSIS candidate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:GITHUB_WORKSPACE "candidate-package/$env:ASSET"
          $install = Join-Path $env:RUNNER_TEMP 'rust-liquid-install'
          if (!(Test-Path -PathType Leaf $installer)) { throw 'Candidate NSIS installer is missing' }
          if ($install -match '\s') { throw 'NSIS /D requires a temporary installation path without spaces' }
          $process = Start-Process -FilePath $installer -ArgumentList "/S /D=$install" -PassThru
          if (!$process.WaitForExit(300000)) { $process.Kill(); throw 'NSIS installation timed out after 300 seconds' }
          if ($process.ExitCode -ne 0) { throw "NSIS installer exited with $($process.ExitCode)" }
          $apps = @(Get-ChildItem $install -Recurse -File -Filter 'gigaam-desktop.exe')
          if ($apps.Count -ne 1) { throw 'Expected exactly one installed gigaam-desktop.exe' }
          $python = @(Get-ChildItem $install -Recurse -File | Where-Object {
            $_.Name -match '^(pythonw?(\d+)?\.(exe|dll)|pyvenv\.cfg)$'
          })
          if ($python.Count) { throw 'Unexpected Python runtime in installed candidate' }
          "PROOF_APP=$($apps[0].FullName)" >> $env:GITHUB_ENV
      - name: Install the WebDriver matching the installed WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $locations = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$key",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$key"
          )
          $versions = @($locations | ForEach-Object {
            if (Test-Path $_) { (Get-ItemProperty $_ -Name pv -ErrorAction SilentlyContinue).pv }
          } | Where-Object { $_ -and $_ -ne '0.0.0.0' } | Sort-Object -Unique)
          if ($versions.Count -ne 1 -or $versions[0] -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Cannot determine one installed WebView2 runtime version: $($versions -join ', ')"
          }
          $version = $versions[0]
          $archive = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $driverDir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Invoke-WebRequest -UseBasicParsing "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $driverDir
          $drivers = @(Get-ChildItem $driverDir -Recurse -File -Filter 'msedgedriver.exe')
          if ($drivers.Count -ne 1) { throw 'Expected one downloaded msedgedriver.exe' }
          $signature = Get-AuthenticodeSignature $drivers[0].FullName
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'Microsoft Edge WebDriver signature is not valid'
          }
          $drivers[0].DirectoryName >> $env:GITHUB_PATH
          Write-Host "WebView2 and downloaded Edge WebDriver version: $version"
      - name: Isolate Linux app data
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rust-liquid-int8-app-data"
          mkdir "$root"
          echo "PROOF_APP_DATA=$root" >> "$GITHUB_ENV"
      - name: Isolate Windows Tauri known folders
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'rust-liquid-int8-app-data'
          if (Test-Path -LiteralPath $root) { throw 'Proof app-data root already exists' }
          $roaming = [Environment]::GetFolderPath([Environment+SpecialFolder]::ApplicationData)
          $local = [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)
          if (!$roaming -or !$local) { throw 'Windows app-data known folders are unavailable' }
          $links = @(
            @{ Name = 'PROOF_ROAMING_LINK'; Path = (Join-Path $roaming 'ru.gigaam.gui.rustliquid'); Target = (Join-Path $root 'roaming/ru.gigaam.gui.rustliquid') },
            @{ Name = 'PROOF_LOCAL_LINK'; Path = (Join-Path $local 'ru.gigaam.gui.rustliquid'); Target = (Join-Path $root 'local/ru.gigaam.gui.rustliquid') }
          )
          foreach ($link in $links) {
            if (Test-Path -LiteralPath $link.Path) { throw "Tauri app-data path already exists: $($link.Path)" }
          }
          New-Item -ItemType Directory -Path $root | Out-Null
          "PROOF_APP_DATA=$root" >> $env:GITHUB_ENV
          foreach ($link in $links) {
            New-Item -ItemType Directory -Path $link.Target -Force | Out-Null
            New-Item -ItemType Junction -Path $link.Path -Target $link.Target | Out-Null
            "$($link.Name)=$($link.Path)" >> $env:GITHUB_ENV
            Write-Host "Tauri known-folder path $($link.Path) -> $($link.Target)"
          }
      - name: Exercise the INT8 bundle through the installed Linux UI
        if: runner.os == 'Linux'
        timeout-minutes: 40
        shell: bash
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' sh -c '
            openbox > "$RUNNER_TEMP/rust-liquid-openbox.log" 2>&1 &
            exec /usr/bin/python3 packaging/rust-liquid/ui-proof.py \
              --app "$PROOF_APP" --app-data "$PROOF_APP_DATA" --model multilingual_ctc \
              --community-bundle "$COMMUNITY_PROOF_BUNDLE" --fixture "$COMMUNITY_PROOF_FIXTURE" \
              --diagnostics "$GITHUB_WORKSPACE/int8-ui-proof-diagnostics" --timeout 1800
          '
      - name: Exercise the INT8 bundle through the installed Windows UI
        if: runner.os == 'Windows'
        timeout-minutes: 40
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python packaging/rust-liquid/ui-proof.py `
            --app "$env:PROOF_APP" --app-data "$env:PROOF_APP_DATA" --model multilingual_ctc `
            --community-bundle "$env:COMMUNITY_PROOF_BUNDLE" --fixture "$env:COMMUNITY_PROOF_FIXTURE" `
            --diagnostics "$env:GITHUB_WORKSPACE/int8-ui-proof-diagnostics" --timeout 1800
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove Windows proof junctions
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $links = @(
            @{ Path = $env:PROOF_ROAMING_LINK; Target = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'rust-liquid-int8-app-data/roaming/ru.gigaam.gui.rustliquid')) },
            @{ Path = $env:PROOF_LOCAL_LINK; Target = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'rust-liquid-int8-app-data/local/ru.gigaam.gui.rustliquid')) }
          )
          foreach ($link in $links) {
            if (!$link.Path) { continue }
            $item = Get-Item -LiteralPath $link.Path -Force
            if ($item.LinkType -ne 'Junction' -or $item.Target -ne $link.Target) {
              throw "Refusing to remove changed proof junction: $($link.Path)"
            }
            $item.Delete()
          }
      - name: Upload failed UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-liquid-int8-ui-${{ matrix.platform }}-diagnostics-${{ github.run_attempt }}
          path: int8-ui-proof-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
      - name: Record successful installed-app evidence
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET: ${{ matrix.asset }}
          ASSET_SHA256: ${{ steps.package.outputs.asset_sha256 }}
          CANDIDATE_RUN_ID: ${{ needs.sources.outputs.candidate_run_id }}
          UI_RUN_ID: ${{ needs.sources.outputs.ui_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ fromJSON(needs.sources.outputs.candidate_artifacts)[matrix.platform].id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ fromJSON(needs.sources.outputs.candidate_artifacts)[matrix.platform].digest }}
          ATTESTATION_ARTIFACT_ID: ${{ fromJSON(needs.sources.outputs.attestation_artifacts)[matrix.platform].id }}
          ATTESTATION_ARTIFACT_DIGEST: ${{ fromJSON(needs.sources.outputs.attestation_artifacts)[matrix.platform].digest }}
          PROOF_BUNDLE_ARTIFACT_ID: ${{ needs.producer.outputs.artifact_id }}
          ARCHIVE_SHA256: ${{ needs.producer.outputs.archive_sha256 }}
          EMBEDDING_SHA256: ${{ needs.producer.outputs.embedding_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads((Path(os.environ['GITHUB_WORKSPACE']) / 'tests/fixtures/rust_liquid_community_smoke.json').read_text(encoding='utf-8'))
          record = {
              'proof_workflow_sha': os.environ['GITHUB_SHA'],
              'proof_run_id': int(os.environ['GITHUB_RUN_ID']),
              'proof_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'proof_bundle_artifact_id': int(os.environ['PROOF_BUNDLE_ARTIFACT_ID']),
              'platform': os.environ['PLATFORM'],
              'candidate_run_id': int(os.environ['CANDIDATE_RUN_ID']),
              'candidate_sha': os.environ['GITHUB_SHA'],
              'candidate_artifact_id': int(os.environ['CANDIDATE_ARTIFACT_ID']),
              'candidate_artifact_digest': os.environ['CANDIDATE_ARTIFACT_DIGEST'],
              'ui_proof_run_id': int(os.environ['UI_RUN_ID']),
              'ui_attestation_artifact_id': int(os.environ['ATTESTATION_ARTIFACT_ID']),
              'ui_attestation_artifact_digest': os.environ['ATTESTATION_ARTIFACT_DIGEST'],
              'candidate_asset': os.environ['ASSET'],
              'candidate_asset_sha256': os.environ['ASSET_SHA256'],
              'bundle_archive_sha256': os.environ['ARCHIVE_SHA256'],
              'embedding_graph_sha256': os.environ['EMBEDDING_SHA256'],
              'fixture': {key: source[key] for key in ('dataset', 'revision', 'license', 'source_ids', 'pcm_sha256')},
              'scope': 'AMI calibration and attributed short UI smoke only; not quality, speed, automatic model delivery, or release evidence.',
          }
          evidence = Path(os.environ['RUNNER_TEMP']) / 'int8-proof-evidence.json'
          with evidence.open('x', encoding='utf-8') as output:
              json.dump(record, output, indent=2)
              output.write('\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(f"Installed {record['platform']} candidate from run {record['candidate_run_id']} used bundle `{record['bundle_archive_sha256']}` with embedding `{record['embedding_graph_sha256']}`. The existing UI harness required two distinct numbered speakers and a saved transcript.\n\n{record['scope']}\n")
          PY
      - name: Upload successful installed-app evidence
        uses: actions/upload-artifact@v7
        with:
          name: rust-liquid-int8-ui-${{ matrix.platform }}-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/int8-proof-evidence.json
          if-no-files-found: error
          retention-days: 14
