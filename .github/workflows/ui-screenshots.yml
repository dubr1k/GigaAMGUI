name: PyQt GUI screenshots

# Renders every page of the PyQt window on Windows and Linux runners so the
# layout can be checked on the platforms the maintainers do not have at hand
# (issue #54: the design was tuned on macOS). Download the "gui-screenshots-*"
# artifacts and look at the PNGs.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/gui/**"
      - "scripts/render_gui_screenshots.py"
      - ".github/workflows/ui-screenshots.yml"

permissions:
  contents: read

jobs:
  render:
    name: Render on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the GUI's light dependencies
        run: python -m pip install "PyQt6>=6.10.0" numpy requests soundfile python-dotenv

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          # The full xcb set: Qt's platform plugin dlopen()s these at start
          # and aborts with "Could not load the Qt platform plugin" otherwise.
          sudo apt-get install -y -q libegl1 libgl1 libdbus-1-3 libfontconfig1 xvfb \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-glx0

      # Windows runners have a desktop session, so the native "windows11"/
      # "windowsvista" style renders with the real platform plugin. Linux
      # renders under Xvfb with the platform default (Fusion) style.
      - name: Render pages (native style)
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'xcb' }}
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a python scripts/render_gui_screenshots.py --out gui-screenshots/native
          else
            python scripts/render_gui_screenshots.py --out gui-screenshots/native
          fi

      - name: Render pages (Fusion, offscreen)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/render_gui_screenshots.py --out gui-screenshots/fusion --style Fusion

      - uses: actions/upload-artifact@v7
        with:
          name: gui-screenshots-${{ matrix.os }}
          path: gui-screenshots
          if-no-files-found: error
