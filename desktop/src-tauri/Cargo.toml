[package]
name = "gigaam-desktop"
version = "2.6.8"
description = "Native desktop shell for GigaAMGUI"
authors = ["GigaAMGUI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gigastt-core = { version = "=2.22.0", default-features = false, features = ["net", "file-decode", "diarization"] }
cpal = "0.15.3"
rtrb = "0.3.2"
hound = "3.5.1"
command-group = { version = "5", features = ["with-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri-plugin-dialog = "2"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "macros", "rt-multi-thread"] }
ytdown = "=0.8.1"
zeroize = "1"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
ryf = "=0.7.4"
rubato = { version = "=5.0.1", default-features = false }
audioadapter-buffers = "=5.2.0"
polyvoice = { version = "=1.0.0", default-features = false, features = ["backend-tract", "segmentation", "vad-earshot"] }
kaldi-fbank = "=0.3.0"
sha2 = { version = "=0.11.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
