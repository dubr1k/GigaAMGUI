[package]
name = "gigaam-desktop"
version = "2.6.8"
description = "Native desktop shell for GigaAMGUI"
authors = ["GigaAMGUI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gigastt-core = { version = "=2.22.0", default-features = false, features = ["net", "file-decode", "diarization"] }
cpal = "0.15.3"
rtrb = "0.3.2"
hound = "3.5.1"
command-group = { version = "5", features = ["with-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri-plugin-dialog = "2"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "macros"] }
ytdown = "=0.8.1"
zeroize = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
