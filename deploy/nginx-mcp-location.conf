# GigaAM MCP (Streamable HTTP) за nginx — фрагмент для server {} блока
# gigaam-site.dubr1k.space (или gigaam-api.dubr1k.space, тогда порт 8000).
# Ответ на tools/call — SSE-поток на всё время распознавания: без буферизации
# и с длинным таймаутом чтения, иначе nginx оборвёт вызов на середине.
# Тело запроса: base64-аудио до GIGAAM_MCP_MAX_INLINE_MB (25 МБ ≈ 34 МБ base64).
# client_max_body_size >= лимита сервера: 64m при GIGAAM_MCP_MAX_INLINE_MB <= 45,
# выше — MAX_INLINE_MB * 4/3 + 1 МиБ (иначе nginx отдаёт 413 вместо [file_too_large]).
# Подробнее: docs/MCP.md.

location /mcp {
    proxy_pass http://127.0.0.1:8001/mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 64m;
}
